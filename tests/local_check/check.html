import api_server as api

async def call(method, path, headers=None, body=b''):
    raw = [(k.lower().encode(), v.encode()) for k, v in (headers or {}).items()]
    path_only, _, qs = path.partition('?')
    scope = {'type': 'http', 'asgi': {'version': '3.0'}, 'http_version': '1.1', 'method': method, 'scheme': 'https', 'path': path_only,
             'raw_path': path_only.encode(), 'query_string': qs.encode(), 'root_path': '', 'headers': raw, 'client': ('1.2.3.4', 1), 'server': ('x', 443)}
    sent = {'status': None, 'headers': {}, 'body': b''}
    first = {'v': True}
    async def receive():
        if first['v']:
            first['v'] = False
            return {'type': 'http.request', 'body': body, 'more_body': False}
        await asyncio.sleep(30)
        return {'type': 'http.disconnect'}
    async def send(m):
        if m['type'] == 'http.response.start':
            sent['status'] = m['status']; sent['headers'] = {k.decode().lower(): v.decode() for k, v in m['headers']}
        elif m['type'] == 'http.response.body':
            sent['body'] += m.get('body', b'')
    await api.app(scope, receive, send)
    return sent
