<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דוגמה: גרף עם שרטוטים — Swing Desk</title>
<!-- v63 demo (17.11): our own chart (Lightweight Charts, open source by TradingView) + drawing tools saved in the browser.
     Not part of the site. Opened through serve.ps1: /src/tests/local_check/chart-demo.html -->
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{ --bg:#0f1216; --panel:#161a20; --panel2:#1c2129; --line:#262c35; --text:#eef1f5; --muted:#8b95a1;
         --amber:#e8a33d; --green:#3ecf7e; --red:#ef5b5b; --struct:#f3d77a; --sky:#6fa8ff; --ma150:#2962ff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;font-size:13px}
  .card{max-width:1200px;margin:18px auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .head{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tk{font-weight:700;font-size:18px} .px{font-size:18px;font-weight:600} .chg{font-weight:600}
  .grow{flex:1}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button,.btn{background:none;border:0;color:var(--muted);padding:6px 10px;cursor:pointer;font:inherit}
  .seg button.on{background:#262c35;color:var(--text)}
  .seg button:hover,.btn:hover{color:var(--text)}
  .btn{border:1px solid var(--line);border-radius:7px;background:var(--panel2)}
  .menu{position:relative}
  .menu .pop{display:none;position:absolute;top:110%;left:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;z-index:20;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .menu.open .pop{display:block}
  .pop label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}
  .pop label:hover{background:#262c35}
  .sw{width:12px;height:3px;border-radius:2px;display:inline-block}
  .body{display:flex;direction:ltr}
  .tools{width:46px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;background:var(--panel)}
  .tools button{width:36px;height:34px;border:0;background:none;color:var(--muted);border-radius:7px;cursor:pointer;display:grid;place-items:center;position:relative}
  .tools button:hover{background:var(--panel2);color:var(--text)}
  .tools button.on{background:#2a2f38;color:var(--amber)}
  .tools .sep{width:26px;height:1px;background:var(--line);margin:4px 0}
  .tools button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:42px;top:50%;transform:translateY(-50%);background:#000;color:#fff;padding:4px 8px;border-radius:5px;white-space:nowrap;font-size:12px;z-index:30;direction:rtl}
  .wrap{position:relative;flex:1;height:560px}
  #chart{position:absolute;inset:0;z-index:0}   /* its own layer: the chart's inner canvases carry z-index 1-2 */
  #ov{position:absolute;inset:0;pointer-events:none;z-index:3}
  .legend{position:absolute;left:10px;top:8px;z-index:5;pointer-events:none;font-size:12px;color:var(--muted);direction:ltr}
  .legend b{color:var(--text);font-weight:600}
  .legend .row{margin-bottom:3px}
  .stylebar{position:absolute;z-index:10;display:none;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 7px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .stylebar .c{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .stylebar .c.on{border-color:#fff}
  .stylebar .v{height:22px;width:1px;background:var(--line)}
  .stylebar button{background:none;border:1px solid transparent;color:var(--muted);border-radius:5px;padding:2px 6px;cursor:pointer;font:inherit;min-width:26px}
  .stylebar button.on{border-color:var(--line);color:var(--text);background:#262c35}
  .stylebar button.del:hover{color:var(--red)}
  #txt{position:absolute;z-index:12;display:none;background:var(--panel2);color:var(--text);border:1px solid var(--amber);border-radius:5px;padding:3px 6px;font:13px "Segoe UI",Arial;direction:ltr;width:180px}
  .foot{display:flex;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex-wrap:wrap}
  .foot a{color:var(--muted)}
  .hint{color:var(--muted)}
  .saved{color:var(--green);opacity:0;transition:opacity .3s}
  .saved.show{opacity:1}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="tk">NVDA</span><span class="hint">NVIDIA · יומי</span>
    <span class="px" id="px"></span><span class="chg" id="chg"></span>
    <span class="grow"></span>
    <div class="menu" id="indMenu">
      <button class="btn" id="indBtn">אינדיקטורים ▾</button>
      <div class="pop" id="indPop"></div>
    </div>
    <div class="seg" id="ranges">
      <button data-n="63">3ח׳</button><button data-n="126">6ח׳</button><button data-n="252">שנה</button><button data-n="9999">הכול</button>
    </div>
  </div>
  <div class="body">
    <div class="tools" id="tools"></div>
    <div class="wrap" id="wrap">
      <div id="chart"></div>
      <canvas id="ov"></canvas>
      <div class="legend" id="legend"></div>
      <div class="stylebar" id="stylebar"></div>
      <input id="txt" placeholder="כתוב טקסט ולחץ Enter">
    </div>
  </div>
  <div class="foot">
    <span>נשמר בדפדפן הזה — נשאר אחרי רענון</span><span class="saved" id="saved">✓ נשמר</span>
    <span class="grow"></span>
    <span>Delete = מחיקה · Ctrl+Z = ביטול · Esc = יציאה מכלי</span>
    <a href="https://www.tradingview.com/" target="_blank" rel="noopener">Charts by TradingView</a>
  </div>
</div>

<script>
(async function(){
const TICKER = 'NVDA';
const KEY_DRAW = 'swing_draw_v1:' + TICKER, KEY_PREFS = 'swing_chart_prefs_v1';
const PALETTE = ['#f3d77a','#6fa8ff','#3ecf7e','#ef5b5b','#e8a33d','#c58cff','#eef1f5'];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

// ---------- data ----------
const raw = await (await fetch('chart-demo-NVDA.json')).json();
const bars = raw.map(r => ({ time:r[0], open:r[1], high:r[2], low:r[3], close:r[4], volume:r[5] }));
const idxOf = new Map(bars.map((b,i) => [b.time, i]));
const N = bars.length;
const last = bars[N-1], prev = bars[N-2];
document.getElementById('px').textContent = '$' + last.close.toFixed(2);
const ch = (last.close/prev.close - 1)*100;
const chgEl = document.getElementById('chg');
chgEl.textContent = (ch>=0?'+':'') + ch.toFixed(2) + '%'; chgEl.style.color = ch>=0 ? 'var(--green)' : 'var(--red)';

// ---------- prefs ----------
const DEFAULT_PREFS = {
  ind:{ ma50:false, ma150:true, ma200:false, vol:true },
  range:252, magnet:true,
  style:{ trend:{color:'#f3d77a',width:2,dash:0}, ray:{color:'#6fa8ff',width:2,dash:0}, hline:{color:'#f3d77a',width:1,dash:1},
          rect:{color:'#6fa8ff',width:1,dash:0}, fib:{color:'#e8a33d',width:1,dash:0}, text:{color:'#eef1f5',width:1,dash:0} }
};
const prefs = Object.assign({}, DEFAULT_PREFS, store.get(KEY_PREFS, {}));
prefs.ind = Object.assign({}, DEFAULT_PREFS.ind, prefs.ind || {});
prefs.style = Object.assign({}, DEFAULT_PREFS.style, prefs.style || {});
const savePrefs = () => store.set(KEY_PREFS, prefs);

// ---------- chart ----------
const wrap = document.getElementById('wrap');
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  autoSize:true,
  layout:{ background:{type:'solid', color:'#0f1216'}, textColor:'#8b95a1', fontFamily:'"Segoe UI",Arial,sans-serif', fontSize:12 },
  grid:{ vertLines:{color:'rgba(255,255,255,0.035)'}, horzLines:{color:'rgba(255,255,255,0.035)'} },
  rightPriceScale:{ borderColor:'#262c35', scaleMargins:{top:0.08, bottom:0.22} },
  timeScale:{ borderColor:'#262c35', rightOffset:10, barSpacing:7 },
  crosshair:{ mode:LightweightCharts.CrosshairMode.Normal,
              vertLine:{color:'rgba(232,163,61,.45)', labelBackgroundColor:'#2a2f38'},
              horzLine:{color:'rgba(232,163,61,.45)', labelBackgroundColor:'#2a2f38'} },
  localization:{ priceFormatter:p => p.toFixed(2) },
});
const ts = chart.timeScale();
const candles = chart.addCandlestickSeries({ upColor:'#3ecf7e', downColor:'#ef5b5b', borderVisible:false, wickUpColor:'#3ecf7e', wickDownColor:'#ef5b5b' });
candles.setData(bars);
const vol = chart.addHistogramSeries({ priceFormat:{type:'volume'}, priceScaleId:'vol', lastValueVisible:false, priceLineVisible:false });
chart.priceScale('vol').applyOptions({ scaleMargins:{top:0.82, bottom:0} });
vol.setData(bars.map(b => ({ time:b.time, value:b.volume, color: b.close>=b.open ? 'rgba(62,207,126,.28)' : 'rgba(239,91,91,.28)' })));

const sma = n => { const out=[]; let s=0; bars.forEach((b,i)=>{ s+=b.close; if(i>=n) s-=bars[i-n].close; if(i>=n-1) out.push({time:b.time, value:s/n}); }); return out; };
const MAS = { ma50:{n:50,color:'#6fa8ff',label:'ממוצע 50'}, ma150:{n:150,color:'#2962ff',label:'ממוצע 150'}, ma200:{n:200,color:'#c58cff',label:'ממוצע 200'} };
for(const k in MAS){
  MAS[k].data = sma(MAS[k].n);
  MAS[k].series = chart.addLineSeries({ color:MAS[k].color, lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
  MAS[k].series.setData(MAS[k].data);
  MAS[k].map = new Map(MAS[k].data.map(d => [d.time, d.value]));
}
function applyInd(){
  for(const k in MAS) MAS[k].series.applyOptions({ visible: !!prefs.ind[k] });
  vol.applyOptions({ visible: !!prefs.ind.vol });
  updateLegend(null);
}
const indPop = document.getElementById('indPop');
indPop.innerHTML = Object.keys(MAS).map(k => `<label><input type="checkbox" data-k="${k}"><span class="sw" style="background:${MAS[k].color}"></span>${MAS[k].label}</label>`).join('')
  + `<label><input type="checkbox" data-k="vol"><span class="sw" style="background:#4b5563"></span>נפח מסחר</label>`;
indPop.querySelectorAll('input').forEach(i => { i.checked = !!prefs.ind[i.dataset.k];
  i.onchange = () => { prefs.ind[i.dataset.k] = i.checked; savePrefs(); applyInd(); flashSaved(); }; });
document.getElementById('indBtn').onclick = e => { e.stopPropagation(); document.getElementById('indMenu').classList.toggle('open'); };
document.addEventListener('click', e => { if(!e.target.closest('#indMenu')) document.getElementById('indMenu').classList.remove('open'); });

function setRange(n){
  prefs.range = n; savePrefs();
  document.querySelectorAll('#ranges button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  ts.setVisibleLogicalRange({ from: Math.max(0, N - n), to: N + 8 });
}
document.querySelectorAll('#ranges button').forEach(b => b.onclick = () => setRange(+b.dataset.n));

// ---------- legend ----------
const legend = document.getElementById('legend');
function updateLegend(p){
  const b = (p && p.time && bars[idxOf.get(p.time)]) || last;
  const i = idxOf.get(b.time), pb = bars[i-1] || b, c = (b.close/pb.close-1)*100, col = c>=0 ? '#3ecf7e' : '#ef5b5b';
  let h = `<div class="row">O <b>${b.open.toFixed(2)}</b> H <b>${b.high.toFixed(2)}</b> L <b>${b.low.toFixed(2)}</b> C <b>${b.close.toFixed(2)}</b> <span style="color:${col}">${c>=0?'+':''}${c.toFixed(2)}%</span></div>`;
  for(const k in MAS) if(prefs.ind[k]){ const v = MAS[k].map.get(b.time); h += `<div class="row"><span style="color:${MAS[k].color}">MA ${MAS[k].n}</span> <b>${v ? v.toFixed(2) : '—'}</b></div>`; }
  legend.innerHTML = h;
}

// ---------- drawings model ----------
// a point = {t: date of a bar, o: offset in bars from it (lines can reach into the future), p: price}
let drawings = store.get(KEY_DRAW, []);
let undo = [];
let selected = null, tool = 'cursor', creating = null, drag = null, hidden = false;
const uid = () => Math.random().toString(36).slice(2, 9);
function commit(){ store.set(KEY_DRAW, drawings); flashSaved(); }
function snapshot(){ undo.push(JSON.stringify(drawings)); if(undo.length > 60) undo.shift(); }
let savedT; function flashSaved(){ const s = document.getElementById('saved'); s.classList.add('show'); clearTimeout(savedT); savedT = setTimeout(() => s.classList.remove('show'), 1200); }

const paneW = () => wrap.clientWidth - chart.priceScale('right').width();
const paneH = () => wrap.clientHeight - ts.height();
function toXY(pt){
  const i = idxOf.has(pt.t) ? idxOf.get(pt.t) : N-1;
  const x = ts.logicalToCoordinate(i + pt.o), y = candles.priceToCoordinate(pt.p);
  return (x == null || y == null) ? null : {x, y};
}
function fromXY(x, y, snap){
  let L = ts.coordinateToLogical(x); if(L == null) return null;
  let p = candles.coordinateToPrice(y); if(p == null) return null;
  if(snap){
    L = Math.round(L);
    const b = bars[Math.min(N-1, Math.max(0, L))];
    if(b && L >= 0 && L < N){
      let best = null, bd = 1e9;
      for(const v of [b.open, b.high, b.low, b.close]){ const d = Math.abs(candles.priceToCoordinate(v) - y); if(d < bd){ bd = d; best = v; } }
      if(bd < 18) p = best;
    }
  }
  const i = Math.min(N-1, Math.max(0, Math.round(L)));
  return { t: bars[i].time, o: L - i, p };
}

// ---------- rendering ----------
const ov = document.getElementById('ov'), ctx = ov.getContext('2d');
const FIB = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function rayEnd(a, b, W){ const dx = b.x - a.x, dy = b.y - a.y; if(Math.abs(dx) < 1e-6) return {x:b.x, y: dy>0 ? 1e4 : -1e4}; const t = ((dx>0 ? W+50 : -50) - a.x)/dx; return {x:a.x+dx*t, y:a.y+dy*t}; }
function priceTag(y, price, color){
  const W = wrap.clientWidth, pw = chart.priceScale('right').width(), txt = price.toFixed(2);
  ctx.font = '12px "Segoe UI",Arial'; ctx.fillStyle = color; ctx.fillRect(W - pw, y - 9, pw, 18);
  ctx.fillStyle = '#0f1216'; ctx.textBaseline = 'middle'; ctx.fillText(txt, W - pw + 6, y);
}
function draw(){
  const dpr = window.devicePixelRatio || 1, W = wrap.clientWidth, H = wrap.clientHeight;
  if(ov.width !== W*dpr || ov.height !== H*dpr){ ov.width = W*dpr; ov.height = H*dpr; ov.style.width = W+'px'; ov.style.height = H+'px'; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(hidden) return;
  const PW = paneW(), PH = paneH();
  const list = creating ? drawings.concat([creating]) : drawings;
  const tags = [];
  for(const d of list){
    const pts = d.pts.map(toXY); if(pts.some(p => !p)) continue;
    const s = d.style, sel = selected === d.id || d === creating;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, PW, PH); ctx.clip();
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.width;
    ctx.setLineDash(s.dash === 1 ? [6,4] : s.dash === 2 ? [2,3] : []);
    const [a, b] = pts;
    if(d.type === 'trend' || d.type === 'ray'){
      const e = (d.type === 'ray' && b) ? rayEnd(a, b, PW) : (b || a);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(e.x, e.y); ctx.stroke();
    } else if(d.type === 'hline'){
      ctx.beginPath(); ctx.moveTo(0, a.y); ctx.lineTo(PW, a.y); ctx.stroke(); tags.push([a.y, d.pts[0].p, s.color]);
    } else if(d.type === 'rect' && b){
      ctx.fillStyle = hexA(s.color, 0.12); ctx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y));
      ctx.strokeRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y));
    } else if(d.type === 'fib' && b){
      const x1 = Math.min(a.x,b.x), x2 = Math.max(a.x,b.x) + 60, p1 = d.pts[0].p, p2 = d.pts[1].p;
      ctx.setLineDash([]); ctx.font = '11px "Segoe UI",Arial'; ctx.textBaseline = 'bottom';
      let prevY = null;
      FIB.forEach((lv, k) => {
        const price = p2 + (p1 - p2)*lv, y = candles.priceToCoordinate(price);
        if(prevY != null){ ctx.fillStyle = hexA(s.color, k%2 ? 0.07 : 0.035); ctx.fillRect(x1, Math.min(prevY,y), x2-x1, Math.abs(y-prevY)); }
        ctx.strokeStyle = hexA(s.color, lv === 0.5 || lv === 0.618 ? 0.95 : 0.6);
        ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
        ctx.fillStyle = s.color; ctx.fillText(`${lv} (${price.toFixed(2)})`, x1 + 4, y - 2);
        prevY = y;
      });
      ctx.strokeStyle = hexA(s.color, .35); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    } else if(d.type === 'text'){
      ctx.font = '600 13px "Segoe UI",Arial'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(d.text || '').width;
      ctx.fillStyle = 'rgba(15,18,22,.75)'; ctx.fillRect(a.x - 4, a.y - 11, w + 8, 22);
      ctx.fillStyle = s.color; ctx.fillText(d.text || '', a.x, a.y);
      if(sel){ ctx.strokeStyle = s.color; ctx.setLineDash([3,3]); ctx.lineWidth = 1; ctx.strokeRect(a.x - 4, a.y - 11, w + 8, 22); }
    }
    if(sel && d.type !== 'text'){
      ctx.setLineDash([]); ctx.lineWidth = 1.5;
      for(const p of pts){ const hx = d.type === 'hline' ? Math.min(PW - 20, Math.max(20, PW/2)) : p.x;
        ctx.beginPath(); ctx.arc(hx, p.y, 5, 0, Math.PI*2); ctx.fillStyle = '#0f1216'; ctx.fill(); ctx.strokeStyle = s.color; ctx.stroke(); }
    }
    ctx.restore();
  }
  tags.forEach(t => priceTag(...t));
  placeStyleBar();
}

// ---------- hit testing ----------
function segDist(px, py, a, b){ const dx = b.x-a.x, dy = b.y-a.y, L = dx*dx+dy*dy; let t = L ? ((px-a.x)*dx+(py-a.y)*dy)/L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(px-(a.x+t*dx), py-(a.y+t*dy)); }
function hit(x, y){
  const PW = paneW();
  for(let k = drawings.length-1; k >= 0; k--){
    const d = drawings[k], pts = d.pts.map(toXY); if(pts.some(p => !p)) continue;
    const [a, b] = pts;
    if(selected === d.id && d.type !== 'hline' && d.type !== 'text'){ for(let j = 0; j < pts.length; j++) if(Math.hypot(pts[j].x-x, pts[j].y-y) < 9) return {d, handle:j}; }
    if(d.type === 'trend' && segDist(x,y,a,b) < 6) return {d};
    if(d.type === 'ray' && segDist(x,y,a,rayEnd(a,b,PW)) < 6) return {d};
    if(d.type === 'hline' && Math.abs(y - a.y) < 6) return {d};
    if(d.type === 'rect'){ const x1=Math.min(a.x,b.x), x2=Math.max(a.x,b.x), y1=Math.min(a.y,b.y), y2=Math.max(a.y,b.y); if(x>x1-5 && x<x2+5 && y>y1-5 && y<y2+5) return {d}; }
    if(d.type === 'fib'){ const x1=Math.min(a.x,b.x), x2=Math.max(a.x,b.x)+60, y1=Math.min(a.y,b.y), y2=Math.max(a.y,b.y); if(x>x1 && x<x2 && y>y1-5 && y<y2+5) return {d}; }
    if(d.type === 'text'){ ctx.font = '600 13px "Segoe UI",Arial'; const w = ctx.measureText(d.text||'').width; if(x>a.x-4 && x<a.x+w+4 && Math.abs(y-a.y)<12) return {d}; }
  }
  return null;
}

// ---------- style bar of the selected drawing ----------
const bar = document.getElementById('stylebar');
function renderStyleBar(){
  const d = drawings.find(z => z.id === selected); if(!d){ bar.style.display = 'none'; return; }
  const s = d.style;
  bar.innerHTML = PALETTE.map(c => `<span class="c ${s.color===c?'on':''}" data-c="${c}" style="background:${c}"></span>`).join('')
    + (d.type !== 'text' ? `<span class="v"></span>` + [1,2,3].map(w => `<button data-w="${w}" class="${s.width===w?'on':''}" title="עובי ${w}"><svg width="20" height="12"><line x1="2" y1="6" x2="18" y2="6" stroke="currentColor" stroke-width="${w}"/></svg></button>`).join('')
    + `<span class="v"></span>` + [['',0,'רציף'],['5 3',1,'מקווקו'],['1.5 2.5',2,'נקודות']].map(([g,v,t]) => `<button data-d="${v}" class="${s.dash===v?'on':''}" title="${t}"><svg width="20" height="12"><line x1="2" y1="6" x2="18" y2="6" stroke="currentColor" stroke-width="1.6" stroke-dasharray="${g}"/></svg></button>`).join('') : `<button data-edit="1" title="עריכה">עריכה</button>`)
    + `<span class="v"></span><button class="del" data-del="1" title="מחיקה"><svg width="16" height="16" viewBox="0 0 18 18"><path d="M4 5h10M7 5V3h4v2M5 5l1 10h6l1-10" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>`;
  bar.style.display = 'flex';
  bar.querySelectorAll('[data-c]').forEach(el => el.onclick = () => setStyle(d, {color: el.dataset.c}));
  bar.querySelectorAll('[data-w]').forEach(el => el.onclick = () => setStyle(d, {width: +el.dataset.w}));
  bar.querySelectorAll('[data-d]').forEach(el => el.onclick = () => setStyle(d, {dash: +el.dataset.d}));
  bar.querySelectorAll('[data-del]').forEach(el => el.onclick = () => removeSelected());
  bar.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => editText(d));
  placeStyleBar();
}
function placeStyleBar(){
  const d = drawings.find(z => z.id === selected); if(!d || bar.style.display === 'none') return;
  const pts = d.pts.map(toXY).filter(Boolean); if(!pts.length) return;
  const top = Math.min(...pts.map(p => p.y)), x = d.type === 'hline' ? paneW()/2 : pts.reduce((s,p) => s+p.x, 0)/pts.length;
  const bw = bar.offsetWidth || 300;
  bar.style.left = Math.max(6, Math.min(paneW() - bw - 6, x - bw/2)) + 'px';
  bar.style.top = Math.max(6, top - 48) + 'px';
}
function setStyle(d, ch){ snapshot(); Object.assign(d.style, ch); prefs.style[d.type] = Object.assign({}, d.style); savePrefs(); commit(); renderStyleBar(); draw(); }
function removeSelected(){ if(!selected) return; snapshot(); drawings = drawings.filter(z => z.id !== selected); selected = null; commit(); renderStyleBar(); draw(); }

// ---------- text input ----------
const txt = document.getElementById('txt');
function editText(d){
  const p = toXY(d.pts[0]); if(!p) return;
  txt.style.display = 'block'; txt.style.left = p.x + 'px'; txt.style.top = (p.y - 14) + 'px'; txt.value = d.text || ''; txt.focus();
  const done = ok => { txt.onkeydown = txt.onblur = null; txt.style.display = 'none';
    if(ok && txt.value.trim()){ snapshot(); d.text = txt.value.trim(); if(!drawings.includes(d)) drawings.push(d); selected = d.id; commit(); }
    renderStyleBar(); draw(); };
  txt.onkeydown = e => { if(e.key === 'Enter') done(true); if(e.key === 'Escape') done(false); e.stopPropagation(); };
  txt.onblur = () => done(true);
}

// ---------- tools ----------
const ICON = {
  cursor:'<path d="M5 3l12 6-5 1.5L9.5 16z" fill="currentColor"/>',
  trend:'<path d="M3 15L15 4" stroke="currentColor" stroke-width="1.6"/><circle cx="3.5" cy="14.5" r="1.8" fill="currentColor"/><circle cx="14.5" cy="4.5" r="1.8" fill="currentColor"/>',
  ray:'<path d="M3 15L17 3" stroke="currentColor" stroke-width="1.6"/><circle cx="3.5" cy="14.5" r="1.8" fill="currentColor"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/>',
  hline:'<path d="M2 9h14" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="9" r="1.8" fill="currentColor"/>',
  rect:'<rect x="3" y="5" width="12" height="8" stroke="currentColor" stroke-width="1.5" fill="none"/>',
  fib:'<path d="M2 4h14M2 7.5h14M2 10.5h14M2 14h14" stroke="currentColor" stroke-width="1.2"/>',
  text:'<path d="M4 4h10M9 4v11" stroke="currentColor" stroke-width="1.8"/>',
  magnet:'<path d="M4 3v6a5 5 0 0010 0V3h-3v6a2 2 0 01-4 0V3z" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  eye:'<path d="M1.5 9S4.5 4 9 4s7.5 5 7.5 5-3 5-7.5 5S1.5 9 1.5 9z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="9" r="2" fill="currentColor"/>',
  trash:'<path d="M4 5h10M7 5V3h4v2M5 5l1 10h6l1-10" fill="none" stroke="currentColor" stroke-width="1.4"/>',
};
const TOOLS = [['cursor','בחירה והזזה'],['trend','קו מגמה'],['ray','קו מגמה מוארך'],['hline','קו אופקי'],['rect','מלבן / אזור'],['fib','פיבונאצ׳י'],['text','טקסט']];
const toolsEl = document.getElementById('tools');
toolsEl.innerHTML = TOOLS.map(([k,t]) => `<button data-tool="${k}" data-tip="${t}"><svg width="18" height="18" viewBox="0 0 18 18">${ICON[k]}</svg></button>`).join('')
  + `<span class="sep"></span><button id="magBtn" data-tip="מגנט: נצמד למחירי הנר"><svg width="18" height="18" viewBox="0 0 18 18">${ICON.magnet}</svg></button>`
  + `<button id="eyeBtn" data-tip="הסתרת השרטוטים"><svg width="18" height="18" viewBox="0 0 18 18">${ICON.eye}</svg></button>`
  + `<button id="trashBtn" data-tip="מחיקת כל השרטוטים"><svg width="18" height="18" viewBox="0 0 18 18">${ICON.trash}</svg></button>`;
function setTool(k){ tool = k; creating = null; toolsEl.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === k)); wrap.style.cursor = k === 'cursor' ? '' : 'crosshair'; draw(); }
toolsEl.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
const magBtn = document.getElementById('magBtn');
const syncMag = () => magBtn.classList.toggle('on', !!prefs.magnet);
magBtn.onclick = () => { prefs.magnet = !prefs.magnet; savePrefs(); syncMag(); };
document.getElementById('eyeBtn').onclick = e => { hidden = !hidden; e.currentTarget.classList.toggle('on', hidden); selected = null; renderStyleBar(); draw(); };
let trashArmed = 0;
document.getElementById('trashBtn').onclick = e => {
  const b = e.currentTarget;
  if(Date.now() - trashArmed < 2500){ snapshot(); drawings = []; selected = null; commit(); renderStyleBar(); draw(); b.dataset.tip = 'מחיקת כל השרטוטים'; trashArmed = 0; b.classList.remove('on'); return; }
  trashArmed = Date.now(); b.dataset.tip = 'ללחוץ שוב כדי למחוק הכול'; b.classList.add('on');
  setTimeout(() => { b.dataset.tip = 'מחיקת כל השרטוטים'; b.classList.remove('on'); }, 2500);
};

// ---------- pointer handling (captured before the chart sees it) ----------
let swallow = false;
const local = e => { const r = wrap.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const inPane = p => p.x >= 0 && p.y >= 0 && p.x < paneW() && p.y < paneH();
wrap.addEventListener('pointerdown', e => {
  swallow = false;
  if(e.target.closest('.stylebar') || e.target === txt) return;
  const m = local(e); if(!inPane(m)) return;
  if(tool !== 'cursor'){
    const pt = fromXY(m.x, m.y, prefs.magnet); if(!pt) return;
    swallow = true; e.stopPropagation(); e.preventDefault();
    const one = tool === 'hline' || tool === 'text';
    if(!creating){
      creating = { id: uid(), type: tool, pts: one ? [pt] : [pt, Object.assign({}, pt)], style: Object.assign({}, prefs.style[tool]) };
      if(tool === 'text'){ const d = creating; creating = null; selected = null; setTool('cursor'); editText(d); return; }
      if(one){ snapshot(); drawings.push(creating); selected = creating.id; creating = null; commit(); setTool('cursor'); renderStyleBar(); return; }
      draw(); return;
    }
    creating.pts[1] = pt; snapshot(); drawings.push(creating); selected = creating.id; creating = null; commit(); setTool('cursor'); renderStyleBar(); return;
  }
  const h = hidden ? null : hit(m.x, m.y);
  if(h){
    swallow = true; e.stopPropagation(); e.preventDefault();
    selected = h.d.id; renderStyleBar();
    drag = { d: h.d, handle: h.handle, start: m, orig: JSON.parse(JSON.stringify(h.d.pts)), moved: false };
    draw();
  } else if(selected){ selected = null; renderStyleBar(); draw(); }
}, true);
['mousedown','touchstart'].forEach(t => wrap.addEventListener(t, e => { if(swallow){ e.stopPropagation(); if(t === 'mousedown') e.preventDefault(); } }, { capture:true, passive:false }));
wrap.addEventListener('dblclick', e => { const m = local(e), h = hit(m.x, m.y); if(h && h.d.type === 'text'){ e.stopPropagation(); editText(h.d); } }, true);

window.addEventListener('pointermove', e => {
  const m = local(e);
  if(creating){ const pt = fromXY(m.x, m.y, prefs.magnet); if(pt){ creating.pts[1] = pt; draw(); } return; }
  if(drag){
    if(!drag.moved){ snapshot(); drag.moved = true; }
    if(drag.handle != null){ const pt = fromXY(m.x, m.y, prefs.magnet); if(pt) drag.d.pts[drag.handle] = pt; }
    else {
      const dxL = ts.coordinateToLogical(m.x) - ts.coordinateToLogical(drag.start.x);
      const dP = candles.coordinateToPrice(m.y) - candles.coordinateToPrice(drag.start.y);
      drag.d.pts = drag.orig.map(p => { const i = idxOf.get(p.t), L = i + p.o + dxL, j = Math.min(N-1, Math.max(0, Math.round(L))); return { t: bars[j].time, o: L - j, p: p.p + dP }; });
    }
    draw(); return;
  }
  if(tool === 'cursor' && e.target.closest && e.target.closest('#wrap') && inPane(m)){ wrap.style.cursor = (!hidden && hit(m.x, m.y)) ? 'move' : ''; }
});
window.addEventListener('pointerup', () => { if(drag){ if(drag.moved) commit(); drag = null; } swallow = false; });

document.addEventListener('keydown', e => {
  if(e.target === txt) return;
  if((e.key === 'Delete' || e.key === 'Backspace') && selected){ removeSelected(); e.preventDefault(); }
  if(e.key === 'Escape'){ creating = null; selected = null; setTool('cursor'); renderStyleBar(); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && undo.length){ drawings = JSON.parse(undo.pop()); selected = null; commit(); renderStyleBar(); draw(); e.preventDefault(); }
});

// redraw whenever the chart moves (scroll, zoom, price-axis drag, resize)
ts.subscribeVisibleLogicalRangeChange(() => draw());
chart.subscribeCrosshairMove(p => { updateLegend(p); draw(); });
let rangeSet = false;   // the range can only be set once the chart has its real width
new ResizeObserver(() => { if(!rangeSet && wrap.clientWidth > 0){ rangeSet = true; setTimeout(() => setRange(prefs.range), 0); } requestAnimationFrame(draw); }).observe(wrap);
wrap.addEventListener('wheel', () => requestAnimationFrame(draw), { passive:true });

applyInd(); syncMag(); setTool('cursor');
document.querySelectorAll('#ranges button').forEach(b => b.classList.toggle('on', +b.dataset.n === prefs.range));
// first visit: one example drawing, so the page does not open empty
if(!localStorage.getItem(KEY_DRAW) && N > 120){
  const lo = bars.slice(N-120).reduce((a,b) => b.low < a.low ? b : a), hi = bars.slice(N-120).reduce((a,b) => b.high > a.high ? b : a);
  drawings.push({ id: uid(), type:'fib', pts:[{t:lo.time,o:0,p:lo.low},{t:hi.time,o:0,p:hi.high}], style: Object.assign({}, prefs.style.fib) });
  commit();
}
requestAnimationFrame(draw);
window.__demo = { drawings: () => drawings, chart };
})();
</script>
</body>
