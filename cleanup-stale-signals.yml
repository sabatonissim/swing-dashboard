name: Cleanup Stale Signals (manual only)

# This workflow NEVER runs on a schedule — it only runs when you click
# "Run workflow" on GitHub, so it can't accidentally delete anything on
# its own. Use it to run cleanup_stale_signals.py without installing
# Python or anything else on your own computer.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Actually delete rows? Leave as "false" first to see the count without changing anything.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Run cleanup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" = "true" ]; then
            python cleanup_stale_signals.py --confirm
          else
            python cleanup_stale_signals.py
          fi
