name: News Aggregator (every 30 min)

on:
  schedule:
    # Every 30 minutes turned out to be too frequent for GitHub's own
    # scheduler to honor reliably (it silently delays/drops runs under
    # load at high frequencies — a known GitHub Actions limitation, not
    # a bug here). Hourly, at a non-round minute (avoids the top-of-hour
    # congestion GitHub itself warns about), is far more likely to
    # actually fire on schedule.
    - cron: '17 * * * *'   # every hour, at :17
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

jobs:
  run-news-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news aggregator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline_b_news_aggregator.py
