name: News Aggregator (every 30 min)

# Started by the API server's built-in scheduler (scheduler.py) every 30 minutes (GitHub's own `schedule` ran it only every
# 4-5 hours — see CLAUDE.md 19.6). Manual runs: Actions -> "Run workflow".
# EMERGENCY FALLBACK: uncomment the schedule below if the built-in scheduler is unavailable.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '17 * * * *'

concurrency:
  group: news-aggregator
  cancel-in-progress: false

jobs:
  run-news-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # was 10; two recent runs stopped right at 10m19s / 10m20s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news aggregator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline_b_news_aggregator.py
