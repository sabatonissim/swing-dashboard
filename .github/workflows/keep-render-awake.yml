name: Keep Render Awake

on:
  schedule:
    - cron: '*/13 * * * *'   # every 13 minutes — comfortably under Render's 15-min sleep timer
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API health endpoint
        run: curl -sf https://swing-dashboard-3btx.onrender.com/api/health || echo "Ping failed (server may be waking up) — not treated as an error"
