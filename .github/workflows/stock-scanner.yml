name: Stock Scanner (twice daily, each with a backup trigger)

on:
  schedule:
    # Times are in UTC. Converted for Israel time (summer/DST: UTC+3).
    # Israel uses UTC+3 in daylight saving (roughly late Mar–late Oct) and
    # UTC+2 the rest of the year — cron doesn't auto-adjust for that, so
    # these times will drift by 1 hour when the clocks change. If you
    # notice the scan running an hour off after a seasonal change, that's
    # why — just ask and these lines get updated.
    #
    # Each session below has two triggers: a primary and a backup ~15 min
    # later. GitHub Actions' `schedule` isn't guaranteed to fire exactly
    # on time — it can be delayed, especially at popular round-number
    # minutes (:00, :15, :30, :45). Using off-peak minutes plus a backup
    # trigger makes the actual scan time much more consistent. The
    # scanner itself skips the backup run if the primary already
    # completed a scan recently (see should_skip_scan in
    # pipeline_a_scanner.py), so this never double-scans.
    - cron: '37 13 * * *'   # 16:37 Israel (summer/DST) — primary, morning session
    - cron: '52 13 * * *'   # 16:52 Israel (summer/DST) — backup, morning session
    - cron: '47 19 * * *'   # 22:47 Israel (summer/DST) — primary, evening session
    - cron: '2 20 * * *'    # 23:02 Israel (summer/DST) — backup, evening session
  workflow_dispatch: {}

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline_a_scanner.py
