name: Stock Scanner (twice daily)

on:
  schedule:
    # Times are in UTC. Converted for 16:40 / 22:50 Israel time.
    # Israel uses UTC+3 in daylight saving (roughly late Mar–late Oct) and
    # UTC+2 the rest of the year — cron doesn't auto-adjust for that, so
    # these times will drift by 1 hour when the clocks change. If you
    # notice the scan running an hour off after a seasonal change, that's
    # why — just ask and these two lines get updated.
    - cron: '40 13 * * *'   # 16:40 Israel (summer/DST)
    - cron: '50 19 * * *'   # 22:50 Israel (summer/DST)
  workflow_dispatch: {}

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline_a_scanner.py
