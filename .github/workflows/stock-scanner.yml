name: Stock Scanner (started externally at market open and close)

# HOW THIS RUNS NOW
# GitHub's own `schedule` trigger turned out to be unusable for this repo: real runs started
# 3-12 hours after their cron time (see CLAUDE.md, section 19.6). So the scans are started by the
# API server's built-in scheduler (scheduler.py on Render), which calls GitHub's workflow_dispatch API
# at exact times in America/New_York (that also removes the twice-a-year daylight-saving drift):
#     weekdays 09:45 ET  -> opening scan        weekdays 16:10 ET  -> closing scan (final daily bars)
# Manual runs: GitHub -> Actions -> "Run workflow" (a manual run always scans, see main() in the scanner).
#
# EMERGENCY FALLBACK: if the built-in scheduler is ever unavailable, uncomment the `schedule:` lines
# below (UTC, US summer time; add one hour after US clocks go back on 1 Nov 2026). Expect delays.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '45 13 * * 1-5'   # 09:45 ET (EDT)
  #   - cron: '10 20 * * 1-5'   # 16:10 ET (EDT)

# Never two scans at once (they used to overlap and double the Yahoo traffic).
concurrency:
  group: stock-scanner
  cancel-in-progress: false

# v18 security: the job only needs to read the code (default token permissions are broader)
permissions:
  contents: read

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # was 30; real runs took up to 28 min
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline_a_scanner.py
