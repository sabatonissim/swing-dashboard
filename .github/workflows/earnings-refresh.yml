name: Quick refresh (heatmap + earnings results)

# Heatmap prices + EPS/revenue for companies that already reported. Small and fast (~2-3 min).
# Started by the API server's built-in scheduler (scheduler.py; see stock-scanner.yml and CLAUDE.md 19.6):
#     weekdays, every 20 minutes between 06:00 and 20:00 America/New_York.
# Manual runs: Actions -> "Run workflow".
# EMERGENCY FALLBACK: uncomment the schedule below (UTC) if the built-in scheduler is unavailable.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "7,27,47 10-23 * * 1-5"

concurrency:
  group: quick-refresh
  cancel-in-progress: false

# v18 security: the job only needs to read the code (default token permissions are broader)
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline_a_scanner.py --quick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}   # v19 price alerts (push notifications)
