name: Econ Data Refresh

# Downloads the FRED/BLS numbers behind the economic calendar ("actual" / "previous") and stores them in Postgres.
# Started by the built-in scheduler on Render (scheduler.py) around release times; can also be run by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 */8 * * *"        # backup only — the scheduler normally starts it

# v18 security: the job only needs to read the code (default token permissions are broader)
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u econ_refresh.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
