name: AI Digest (manual test)

# Manual only: Actions -> "AI Digest (manual test)" -> Run workflow, then pick a mode:
#   probe  = test which AI models really work for your key right now (prints a ready LLM_MODELS value) ~2 min
#   digest = generate the AI digest now (forced) ~1 min
# Uses the same settings as news-aggregator.yml (LLM_API_KEY secret, optional LLM_BASE_URL / LLM_MODELS variables).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = which models work for my key | digest = generate the digest now"
        type: choice
        options:
          - probe
          - digest
        default: probe

# v18 security: the job only needs to read the code (default token permissions are broader)
permissions:
  contents: read

jobs:
  ai-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI step (${{ inputs.mode }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODELS: ${{ vars.LLM_MODELS }}
        run: python ai_digest.py --${{ inputs.mode == 'digest' && 'force' || 'probe' }}
