name: AI Digest (manual test)

# Runs ONLY the AI digest step (about 1 minute) — for testing the AI connection without waiting for the full
# news pipeline. Manual only: Actions -> "AI Digest (manual test)" -> Run workflow.
# Uses the same settings as news-aggregator.yml (LLM_API_KEY secret, optional LLM_BASE_URL / LLM_MODELS variables).
on:
  workflow_dispatch: {}

jobs:
  ai-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI digest now (forced)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODELS: ${{ vars.LLM_MODELS }}
        run: python ai_digest.py --force
