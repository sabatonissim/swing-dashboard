name: Earnings fast

# v33: today's reports only (EPS + revenue from the SEC press release, or Yahoo if it already has them), so results reach
# the site minutes after the filing. Started by the built-in scheduler on Render (scheduler.py) every 5 minutes around the
# report hours; can also be run by hand. The 30-minute "Quick refresh" keeps doing everything else.
on:
  workflow_dispatch: {}

concurrency:
  group: earnings-fast
  cancel-in-progress: false

# the job only needs to read the code (default token permissions are broader)
permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline_a_scanner.py --earnings-fast
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # v40: the company's guidance from the same press release + the consensus saved before upcoming reports (at most ~2.5 min)
      - run: python -u earnings_guidance.py
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODELS: ${{ vars.LLM_MODELS }}
