name: Market Breadth

# v22: share of S&P 500 stocks above their 50/200-day averages, new 52-week highs/lows, advancers/decliners ->
# Postgres (market_breadth). Started by the built-in scheduler on Render (scheduler.py); can also be run by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * 1-5"       # backup only — the scheduler normally starts it

# the job only needs to read the code (default token permissions are broader)
permissions:
  contents: read

jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u market_breadth.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
