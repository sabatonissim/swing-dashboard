name: Fund Holdings

# v25: what well-known funds hold (quarterly 13F filings to the SEC) -> Postgres (fund_holdings, fund_filings).
# Started daily by the built-in scheduler on Render (scheduler.py); a fund is re-read only after a new filing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u fund_holdings.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
