
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Swing Desk — דשבורד מסחר</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1216;
    --panel: #161a20;
    --panel-2: #1c2129;
    --line: #262c36;
    --text: #eef1f5;
    --text-dim: #8a93a3;
    --amber: #e8a33d;
    --amber-dim: #6b532a;
    --teal: #35b3a3;
    --teal-dim: #1c4b45;
    --green: #3ecf7e;
    --red: #ef5b5b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif;height:100%;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Frank Ruhl Libre',serif;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#12151a,#0f1216);
  }
  header .logo{display:flex;align-items:center;gap:10px;}
  header .logo .mark{
    width:10px;height:10px;border-radius:2px;background:var(--amber);
    box-shadow:0 0 12px var(--amber);
  }
  header h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:22px;margin:0;letter-spacing:0.3px;}
  header .sub{color:var(--text-dim);font-size:13px;margin-top:2px;}
  header .clock{color:var(--text-dim);font-size:13px;}

  .search-wrap{display:flex;align-items:center;gap:8px;flex:1;max-width:340px;margin:0 24px;}
  .search-input{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none;
  }
  .search-input:focus{border-color:var(--amber-dim);}
  .search-btn{
    background:var(--amber);color:#1a1300;border:none;border-radius:8px;
    padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .search-btn:hover{opacity:0.9;}
  @media (max-width:900px){ .search-wrap{display:none;} }

  .board{
    display:grid;grid-template-columns:1fr 3px 1fr;
    height:calc(100vh - 76px);
  }
  @media (max-width:900px){ .board{grid-template-columns:1fr;} .divider{display:none;} }

  .divider{position:relative;background:var(--line);overflow:hidden;}
  .divider svg{position:absolute;top:0;right:-14px;height:100%;width:32px;opacity:0.6;}

  .col{overflow-y:auto;padding:22px 24px 60px;}
  .col::-webkit-scrollbar{width:8px;}
  .col::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .col-title{
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
    font-size:13px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;
  }
  .col-title .dot{width:7px;height:7px;border-radius:50%;}
  .right .dot{background:var(--amber);}
  .left .dot{background:var(--teal);}

  /* --- Scanner rows --- */
  .stock-row{
    display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    cursor:pointer;transition:transform .15s ease, border-color .15s ease;
  }
  .stock-row:hover{border-color:var(--amber-dim);transform:translateX(-2px);}
  .stock-row .ticker{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:16px;min-width:58px;}
  .stock-row .trend{font-size:18px;width:20px;text-align:center;}
  .trend.up{color:var(--green);} .trend.down{color:var(--red);}
  .stock-row .trigger{flex:1;font-size:13.5px;color:var(--text-dim);}
  .score-badge{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;
    padding:4px 9px;border-radius:20px;min-width:38px;text-align:center;
  }
  .score-hi{background:rgba(62,207,126,.15);color:var(--green);}
  .score-mid{background:rgba(232,163,61,.15);color:var(--amber);}

  /* --- Macro items --- */
  .macro-item{
    display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);
  }
  .macro-tag{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    padding:4px 8px;border-radius:6px;height:fit-content;white-space:nowrap;
  }
  .tag-critical{background:rgba(239,91,91,.15);color:var(--red);}
  .tag-high{background:rgba(53,179,163,.15);color:var(--teal);}
  .macro-text{font-size:14px;line-height:1.55;}
  .macro-time{color:var(--text-dim);font-size:11.5px;margin-top:4px;}

  /* --- Drawer --- */
  .overlay{
    position:fixed;inset:0;background:rgba(6,8,10,.6);backdrop-filter:blur(2px);
    display:none;align-items:stretch;justify-content:flex-start;z-index:50;
  }
  .overlay.open{display:flex;}
  .drawer{
    width:min(460px,92vw);background:var(--panel-2);height:100%;
    border-left:1px solid var(--line);padding:26px 24px;overflow-y:auto;
    transform:translateX(-100%);transition:transform .28s ease;
  }
  .overlay.open .drawer{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .drawer-head h2{font-family:'JetBrains Mono',monospace;font-size:24px;margin:0;}
  .close-btn{
    background:none;border:1px solid var(--line);color:var(--text-dim);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;
  }
  .close-btn:hover{color:var(--text);}
  .chart-placeholder{
    height:160px;border-radius:10px;background:var(--panel);border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12.5px;
    margin-bottom:18px;
  }
  .tv-chart-box{height:260px;border-radius:10px;overflow:hidden;margin-bottom:18px;background:var(--panel);}
  .news-section{margin-bottom:18px;}
  .news-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .news-item a{color:var(--text);font-size:13.5px;text-decoration:none;line-height:1.5;display:block;}
  .news-item a:hover{color:var(--amber);}
  .gauge-wrap{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
  .gauge-num{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600;}
  .gauge-label{color:var(--text-dim);font-size:12.5px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
  .stat .k{color:var(--text-dim);font-size:11.5px;margin-bottom:3px;}
  .stat .v{font-family:'JetBrains Mono',monospace;font-size:15px;}
  .ai-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.6;margin-bottom:18px;}
  .ai-box .label{color:var(--amber);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
  .deep-btn{
    display:block;width:100%;text-align:center;padding:12px;border-radius:9px;
    background:var(--amber);color:#1a1300;font-weight:700;border:none;cursor:pointer;font-size:14px;
  }
  .disclaimer-strip{
    font-size:11px;color:var(--text-dim);text-align:center;padding:10px 24px;border-top:1px solid var(--line);
  }
</style>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<header>
  <div class="logo">
    <div class="mark"></div>
    <div>
      <h1>Swing Desk</h1>
      <div class="sub">פרוטוטייפ תצוגה — נתוני דמו</div>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="search-input" class="search-input mono" placeholder="חפש טיקר... (למשל AAPL)" />
    <button class="search-btn" onclick="handleSearch()">חפש</button>
  </div>
  <div class="clock mono" id="clock"></div>
</header>

<div class="board">
  <div class="col right">
    <div class="col-title"><span class="dot"></span> סורק סווינג — משימות פתוחות</div>
    <div id="stocks"></div>
  </div>

  <div class="divider">
    <svg viewBox="0 0 32 400" preserveAspectRatio="none">
      <polyline points="0,20 8,60 4,110 20,150 10,210 24,260 6,310 16,360 2,400"
        fill="none" stroke="#3a4250" stroke-width="1.5"/>
    </svg>
  </div>

  <div class="col left">
    <div class="col-title"><span class="dot"></span> מוקד מאקרו וחדשות עולם</div>
    <div id="macro"></div>
  </div>
</div>

<div class="disclaimer-strip">
  התוכן להמחשה בלבד ואינו מהווה ייעוץ השקעות או המלצה לביצוע עסקה.
</div>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<script>
const stocks = [
  {ticker:"IGV", trend:"up", score:82, trigger:"פריצת שיאים יורדים בווליום חזק", entry:71.4, support:66.2, resistance:[74.9,78.6], socialSpike:64, summary:"קהילת הטריידרים מדגישה חוזק סקטור התוכנה מול ריבית יציבה; עלייה חדה בדיונים סביב תוצאות רבעוניות קרובות."},
  {ticker:"CRWD", trend:"up", score:76, trigger:"פריצת דגל שורי על נפח גבוה", entry:298.1, support:281.0, resistance:[312.0,329.5], socialSpike:41, summary:"עניין גובר סביב הרחבת חוזי אבטחת ענן; נצפתה מגמה חיובית עקבית בפורומים המקצועיים."},
  {ticker:"PLTR", trend:"down", score:38, trigger:"כישלון בפריצה, לחץ מכירה", entry:24.6, support:22.1, resistance:[26.0,27.4], socialSpike:12, summary:"נפח הדיון ירד משמעותית מהשיא; חלק מהקהילה מביע חשש מהערכת שווי גבוהה."},
  {ticker:"SNOW", trend:"up", score:69, trigger:"פריצת Cup & Handle", entry:132.9, support:124.0, resistance:[138.5,145.0], socialSpike:53, summary:"התעניינות מוגברת סביב שותפויות AI חדשות; טון הדיונים חיובי אך לא אופורי."},
  {ticker:"SMH", trend:"up", score:71, trigger:"פריצת שיאים יורדים על נפח כבד", entry:248.3, support:231.0, resistance:[258.0,269.0], socialSpike:47, summary:"סקטור השבבים מרכז תשומת לב מוגברת לקראת עונת דוחות; נצפית מגמה חיובית רחבה."},
  {ticker:"UBER", trend:"down", score:44, trigger:"בדיקת תמיכה מחדש", entry:71.2, support:67.5, resistance:[75.0,79.0], socialSpike:19, summary:"דיון מפוצל בקהילה סביב תחרות מוגברת בשוק; אין מגמה ברורה כרגע."},
  {ticker:"COIN", trend:"up", score:78, trigger:"פריצת דגל שורי בליווי ווליום", entry:214.6, support:198.0, resistance:[228.0,241.0], socialSpike:88, summary:"קפיצה חדה בדיון סביב רגולציה חיובית לענף הקריפטו; עניין ציבורי מוגבר ניכר."},
  {ticker:"SHOP", trend:"up", score:65, trigger:"פריצת שיאים יורדים", entry:78.9, support:73.0, resistance:[82.5,87.0], socialSpike:33, summary:"עלייה מתונה בדיון סביב הרחבת שירותי מסחר אלקטרוני; מגמה חיובית יציבה."},
];

const macro = [
  {tag:"CPI", impact:"High", text:"מדד ה-CPI בארה״ב עלה ב-2.4%, תואם את התחזיות ומוריד חשש מאינפלציה.", time:"לפני 42 דק׳", source:"Reuters", link:"#", sectors:"טכנולוגיה, נדל״ן — רגישים במיוחד לריבית"},
  {tag:"ריבית", impact:"Critical", text:"הפד השאיר את הריבית ללא שינוי, אך רמז לאפשרות הפחתה ברבעון הבא.", time:"לפני 3 שעות", source:"Bloomberg", link:"#", sectors:"בנקים, סקטור הצריכה"},
  {tag:"גאופוליטי", impact:"Critical", text:"הסלמה בשיט הימי במפרז מעלה חשש לשיבוש באספקת נפט גולמי.", time:"לפני 5 שעות", source:"Reuters", link:"#", sectors:"אנרגיה, תעופה, שילוח"},
  {tag:"תעסוקה", impact:"High", text:"דוח המשרות החדשות הפתיע לטובה עם 210 אלף משרות מול תחזית של 180 אלף.", time:"אתמול", source:"Investing.com", link:"#", sectors:"כלל השוק — משפיע על ציפיות הריבית הבאה"},
  {tag:"נפט", impact:"High", text:"מלאי הנפט הגולמי בארה״ב ירד מעבר לתחזיות, תומך במחירי האנרגיה.", time:"אתמול", source:"Bloomberg", link:"#", sectors:"אנרגיה, תעשייה"},
  {tag:"אינפלציה", impact:"High", text:"מדד ה-PPI הצביע על התמתנות בלחצי המחירים ברמת הסיטונאות.", time:"לפני יומיים", source:"Reuters", link:"#", sectors:"כלל השוק"},
  {tag:"סחר", impact:"Critical", text:"הודעה על מכסים חדשים על יבוא טכנולוגי מעלה חשש משיבוש שרשראות אספקה.", time:"לפני יומיים", source:"Investing.com", link:"#", sectors:"טכנולוגיה, שבבים, קמעונאות"},
  {tag:"תעסוקה", impact:"High", text:"תביעות אבטלה שבועיות עלו מעט מעבר לתחזיות, אך נותרו ברמה נמוכה היסטורית.", time:"לפני 3 ימים", source:"Reuters", link:"#", sectors:"כלל השוק"},
];

function scoreClass(s){ return s>=60 ? "score-hi" : "score-mid"; }

function renderStocks(){
  const el = document.getElementById("stocks");
  el.innerHTML = stocks.map((s,i)=>`
    <div class="stock-row" onclick="openDrawer(${i})">
      <div class="ticker">${s.ticker}</div>
      <div class="trend ${s.trend}">${s.trend==="up"?"▲":"▼"}</div>
      <div class="trigger">${s.trigger}</div>
      <div class="score-badge ${scoreClass(s.score)}">${s.score}</div>
    </div>
  `).join("");
}

function renderMacro(){
  const el = document.getElementById("macro");
  el.innerHTML = macro.map((m,i)=>`
    <div class="macro-item" onclick="openMacroDrawer(${i})" style="cursor:pointer">
      <div class="macro-tag ${m.impact==='Critical'?'tag-critical':'tag-high'}">${m.tag}</div>
      <div>
        <div class="macro-text">${m.text}</div>
        <div class="macro-time">${m.time}</div>
      </div>
    </div>
  `).join("");
}

function openMacroDrawer(i){
  const m = macro[i];
  const drawer = document.getElementById("drawer");
  drawer.innerHTML = `
    <div class="drawer-head">
      <h2 style="font-family:'Heebo',sans-serif;font-size:19px;">${m.tag}</h2>
      <button class="close-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr;">
      <div class="stat"><div class="k">רמת חשיבות</div><div class="v">${m.impact === 'Critical' ? 'קריטית' : 'גבוהה'}</div></div>
      <div class="stat"><div class="k">מקור</div><div class="v">${m.source || '—'}</div></div>
    </div>
    <div class="ai-box">
      <div class="label">תקציר עובדתי</div>
      ${m.text}
    </div>
    <div class="ai-box">
      <div class="label">סקטורים מושפעים</div>
      ${m.sectors || 'לא סופק ניתוח סקטוריאלי עבור ידיעה זו'}
    </div>
    <div class="macro-time" style="margin-bottom:14px;">${m.time}</div>
    ${m.link && m.link !== '#' ? `<button class="deep-btn" onclick="window.open('${m.link}','_blank')">לכתבה המקורית ←</button>` : ''}
  `;
  document.getElementById("overlay").classList.add("open");
  track('view_macro', m.tag);
}

function openDrawer(i){
  const s = stocks[i];
  const drawer = document.getElementById("drawer");
  drawer.innerHTML = `
    <div class="drawer-head">
      <h2>${s.ticker}</h2>
      <button class="close-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div id="tv-chart" class="tv-chart-box"></div>
    <div class="gauge-wrap">
      <div class="gauge-num" style="color:${s.score>=60?'var(--green)':'var(--amber)'}">${s.score}</div>
      <div class="gauge-label">מד סנטימנט AI (0–100)<br>קפיצת דיון חברתי: ${s.socialSpike}%+</div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="k">מחיר כניסה</div><div class="v">$${s.entry}</div></div>
      <div class="stat"><div class="k">רמת תמיכה</div><div class="v">$${s.support}</div></div>
      <div class="stat"><div class="k">יעד 1</div><div class="v">$${s.resistance[0]}</div></div>
      <div class="stat"><div class="k">יעד 2</div><div class="v">$${s.resistance[1]}</div></div>
    </div>
    <div class="ai-box">
      <div class="label">תקציר AI — עובדתי בלבד</div>
      ${s.summary}
    </div>
    <div class="news-section">
      <div class="label">חדשות אחרונות</div>
      <div id="stock-news-list">טוען חדשות...</div>
    </div>
    <button class="deep-btn" onclick="alert('כאן ינווט לדף הדוח המעמיק המלא')">דוח מעמיק ←</button>
  `;
  document.getElementById("overlay").classList.add("open");
  renderTradingViewChart(s.ticker);
  loadStockNews(s.ticker);
  track('view_stock', s.ticker);
}
function closeDrawer(){ document.getElementById("overlay").classList.remove("open"); }
document.getElementById("overlay").addEventListener("click", e=>{
  if(e.target.id==="overlay") closeDrawer();
});

function tickClock(){
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tickClock,1000); tickClock();

const API_BASE = "https://swing-dashboard-production-438f.up.railway.app";

function getSessionId(){
  let sid = localStorage.getItem('swing_sid');
  if (!sid) {
    sid = crypto.randomUUID();
    localStorage.setItem('swing_sid', sid);
  }
  return sid;
}
function track(eventType, entityId){
  fetch(`${API_BASE}/api/track`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({event_type: eventType, entity_id: entityId, session_id: getSessionId()}),
  }).catch(()=>{});
}
track('page_view', null);

const statusEl = document.createElement("div");
statusEl.style.cssText = "position:fixed;bottom:12px;left:16px;font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 9px;border-radius:6px;z-index:60;";
document.body.appendChild(statusEl);

function setStatus(connected){
  statusEl.textContent = connected ? "● מחובר ל-API" : "● נתוני דמו (ה-API לא זמין)";
  statusEl.style.background = connected ? "rgba(62,207,126,.15)" : "rgba(232,163,61,.15)";
  statusEl.style.color = connected ? "var(--green)" : "var(--amber)";
}

function mapDbRowToStock(r){
  return {
    ticker: r.ticker,
    trend: (r.swing_score >= 50) ? "up" : "down",
    score: r.swing_score,
    trigger: r.trigger_text_he,
    entry: r.entry_price,
    support: r.support_level,
    resistance: r.resistance_targets,
    socialSpike: r.social_volume_spike_pct,
    summary: r.ai_summary_he,
  };
}

async function loadFromApi(){
  try {
    const [stocksRes, macroRes] = await Promise.all([
      fetch(`${API_BASE}/api/stocks`),
      fetch(`${API_BASE}/api/macro-news`),
    ]);
    if (!stocksRes.ok || !macroRes.ok) throw new Error("API error");

    const dbStocks = await stocksRes.json();
    const dbMacro = await macroRes.json();

    if (dbStocks.length > 0) {
      stocks.length = 0;
      for (const row of dbStocks) stocks.push(mapDbRowToStock(row));
    }
    if (dbMacro.length > 0) {
      macro.length = 0;
      for (const row of dbMacro) {
        macro.push({
          tag: row.category_tag,
          impact: row.impact_level,
          text: row.summary_he,
          time: new Date(row.timestamp).toLocaleString('he-IL'),
          source: row.source_url ? new URL(row.source_url).hostname.replace('www.','') : '',
          link: row.source_url || '#',
        });
      }
    }
    setStatus(true);
  } catch (e) {
    console.warn("API offline, showing demo data:", e);
    setStatus(false);
  }
  renderStocks();
  renderMacro();
}

loadFromApi();
setInterval(loadFromApi, 20000);

// ---- תיקון מנגנון החיפוש החופשי כאן למטה ----
async function handleSearch(){
  const raw = document.getElementById("search-input").value.trim();
  if (!raw) return;
  const ticker = raw.toUpperCase();

  const drawer = document.getElementById("drawer");
  // הוספנו כאן את תיבת הגרף (#tv-chart) כדי שתוכל להתרנדר מיד בחיפוש חופשי
  drawer.innerHTML = `
    <div class="drawer-head">
      <h2>${ticker}</h2>
      <button class="close-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div id="tv-chart" class="tv-chart-box"></div>
    <div class="ai-box" id="loading-box">טוען נתונים...</div>
  `;
  document.getElementById("overlay").classList.add("open");
  
  // מציג את הגרף מיד בשנייה שהחלון נפתח, בלי לחכות לשרת
  renderTradingViewChart(ticker);

  try {
    const res = await fetch(`${API_BASE}/api/lookup/${ticker}`);
    if (!res.ok) {
      document.getElementById("loading-box").textContent = "לא נמצא מידע נוסף על טיקר זה, מציג גרף בלבד.";
      return;
    }
    const d = await res.json();
    const changeColor = d.change_pct >= 0 ? 'var(--green)' : 'var(--red)';
    
    // מעדכנים את שאר הנתונים מתחת לגרף הקיים
    document.getElementById("loading-box").remove();
    
    const statsHtml = `
      <div class="macro-time" style="margin-bottom:14px;">${d.name} · ${d.exchange || ''}</div>
      <div class="gauge-wrap">
        <div class="gauge-num" style="color:${changeColor}">$${d.price}</div>
        <div class="gauge-label">שינוי יומי: <span style="color:${changeColor}">${d.change_pct}%</span></div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="k">שווי שוק</div><div class="v">${d.market_cap ? (d.market_cap/1e9).toFixed(1)+'B$' : '—'}</div></div>
        <div class="stat"><div class="k">נפח ממוצע 20 יום</div><div class="v">${d.avg_volume_20d ? Math.round(d.avg_volume_20d/1e6)+'M' : '—'}</div></div>
        <div class="stat"><div class="k">שיא 52 שבועות</div><div class="v">$${d.week52_high ?? '—'}</div></div>
        <div class="stat"><div class="k">שפל 52 שבועות</div><div class="v">$${d.week52_low ?? '—'}</div></div>
        <div class="stat"><div class="k">סקטור</div><div class="v" style="font-size:12px;">${d.sector || '—'}</div></div>
        <div class="stat"><div class="k">מכפיל רווח (P/E)</div><div class="v">${d.pe_ratio ? d.pe_ratio.toFixed(1) : '—'}</div></div>
      </div>
      <div class="news-section">
        <div class="label">חדשות אחרונות</div>
        <div id="stock-news-list">טוען חדשות...</div>
      </div>
    `;
    drawer.insertAdjacentHTML('beforeend', statsHtml);
    loadStockNews(ticker);
    track('search_stock', ticker);
  } catch (e) {
    document.getElementById("loading-box").textContent = "לא ניתן לטעון נתונים מהשרת כרגע, מציג גרף בלבד.";
  }
}

document.getElementById("search-input").addEventListener("keydown", e=>{
  if (e.key === "Enter") handleSearch();
});

function renderTradingViewChart(ticker){
  const container = document.getElementById("tv-chart");
  if (!container || typeof TradingView === "undefined") return;
  container.innerHTML = ""; 
  new TradingView.widget({
    autosize: true,
    symbol: ticker,
    interval: "D",
    timezone: "Asia/Jerusalem",
    theme: "dark",
    style: "1",
    locale: "he_IL",
    toolbar_bg: "#161a20",
    hide_top_toolbar: false,
    hide_legend: false,
    save_image: false,
    container_id: "tv-chart",
  });
}

async function loadStockNews(ticker){
  const el = document.getElementById("stock-news-list");
  if (!el) return;
  try {
    const res = await fetch(`${API_BASE}/api/stock-news/${ticker}`);
    if (!res.ok) throw new Error("news failed");
    const items = await res.json();
    if (!items.length) {
      el.innerHTML = `<div class="macro-time">לא נמצאו כתבות עדכניות עבור ${ticker}</div>`;
      return;
    }
    el.innerHTML = items.map(n => `
      <div class="news-item">
        <a href="${n.link}" target="_blank" rel="noopener">${n.title}</a>
        <div class="macro-time">${n.publisher || ''}</div>
      </div>
    `).join("");
  } catch (e) {
    el.innerHTML = `<div class="macro-time">לא ניתן לטעון חדשות כרגע</div>`;
  }
}
</script>
