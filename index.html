<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Swing Desk — דשבורד מסחר</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1216;
    --panel: #161a20;
    --panel-2: #1c2129;
    --line: #262c36;
    --text: #eef1f5;
    --text-dim: #8a93a3;
    --amber: #e8a33d;
    --amber-dim: #6b532a;
    --teal: #35b3a3;
    --teal-dim: #1c4b45;
    --green: #3ecf7e;
    --red: #ef5b5b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---- Header ---- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#12151a,#0f1216);
    position:sticky;top:0;z-index:40;
  }
  header .logo{display:flex;align-items:center;gap:10px;}
  header .logo .mark{width:10px;height:10px;border-radius:2px;background:var(--amber);box-shadow:0 0 12px var(--amber);}
  header h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:20px;margin:0;}
  header .sub{color:var(--text-dim);font-size:12px;margin-top:1px;}
  header .clock{color:var(--text-dim);font-size:13px;}
  .search-wrap{display:flex;align-items:center;gap:8px;flex:1;max-width:320px;margin:0 20px;}
  .search-input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;}
  .search-input:focus{border-color:var(--amber-dim);}
  .search-btn{background:var(--amber);color:#1a1300;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;}
  .mobile-search{display:none;padding:10px 16px;gap:8px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  .mobile-search .search-input{flex:1;}
  @media(max-width:900px){.search-wrap{display:none;}.mobile-search{display:flex;}}

  /* ---- Breaking news bar ---- */
  .breaking-bar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 24px 14px;}
  .breaking-bar-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;letter-spacing:1.5px;color:var(--red);text-transform:uppercase;font-weight:700;}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .breaking-items{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;}
  .breaking-items::-webkit-scrollbar{display:none;}
  .breaking-card{flex-shrink:0;max-width:260px;background:rgba(239,91,91,.07);border:1px solid rgba(239,91,91,.2);border-radius:10px;padding:10px 14px;cursor:pointer;transition:border-color .15s;}
  .breaking-card:hover{border-color:rgba(239,91,91,.5);}
  .breaking-card .b-tag{font-size:10px;color:var(--red);font-weight:700;margin-bottom:4px;letter-spacing:1px;}
  .breaking-card .b-text{font-size:13px;line-height:1.45;}

  /* ---- Market charts ---- */
  .market-charts{background:var(--panel-2);border-bottom:1px solid var(--line);padding:12px 24px;}
  .market-charts-title{font-size:11px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .chart-tabs{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
  .chart-tab{padding:5px 13px;border-radius:20px;font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text-dim);transition:all .15s;}
  .chart-tab.active{background:var(--amber);color:#1a1300;border-color:var(--amber);font-weight:700;}
  .chart-tab:hover:not(.active){border-color:var(--amber-dim);color:var(--text);}
  #market-tv-chart{height:220px;border-radius:10px;overflow:hidden;background:var(--panel);direction:ltr;}
  .sector-chart-wrap{height:220px;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);padding:8px;box-sizing:border-box;}
  .pct-up{color:var(--green);}
  .pct-down{color:var(--red);}

  .market-charts-row{display:flex;gap:18px;align-items:stretch;}
  .chart-col{flex:1 1 62%;min-width:0;}
  .movers-col{flex:1 1 38%;min-width:0;max-width:340px;display:flex;flex-direction:column;}
  @media(max-width:900px){.market-charts-row{flex-direction:column;}.movers-col{max-width:none;}}
  .movers-title{font-size:11px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .movers-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap;}
  .movers-head-row .movers-title{margin-bottom:0;}
  .movers-toggle{display:flex;gap:4px;background:var(--panel-2);border-radius:8px;padding:2px;}
  .movers-toggle-btn{background:transparent;border:none;color:var(--text-dim);font-size:10.5px;font-weight:600;padding:5px 9px;border-radius:6px;cursor:pointer;font-family:'Heebo',sans-serif;white-space:nowrap;}
  .movers-toggle-btn.active{background:var(--amber);color:#1a1a1a;}
  .view-mode-toggle{display:flex;gap:4px;background:var(--panel-2);border-radius:8px;padding:2px;}
  .mode-btn{background:transparent;border:none;color:var(--text-dim);font-size:11px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Heebo',sans-serif;white-space:nowrap;}
  .mode-btn.active{background:var(--amber);color:#1a1a1a;}
  .watchlist-add-btn{background:var(--amber);color:#1a1a1a;border:none;border-radius:8px;width:26px;height:26px;font-size:16px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;}
  .watchlist-add-btn:hover{opacity:.85;}
  .watchlist-star{cursor:pointer;font-size:15px;line-height:1;user-select:none;color:var(--text-dim);}
  .watchlist-star.active{color:var(--amber);}
  .movers-list{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;height:220px;overflow-y:auto;}
  .movers-list::-webkit-scrollbar{width:5px;}
  .movers-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .mover-row{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
  .mover-row:last-child{border-bottom:none;}
  .mover-row:hover .mover-ticker{color:var(--amber);}
  .mover-ticker{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;min-width:52px;transition:color .15s;}
  .mover-trigger{flex:1;font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mover-pct{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;min-width:56px;text-align:left;}
  .mover-pct.up{color:var(--green);}
  .mover-pct.down{color:var(--red);}
  .movers-empty{color:var(--text-dim);font-size:12.5px;padding:14px 6px;text-align:center;}

  /* ---- Main board ---- */
  .board{display:grid;grid-template-columns:1fr 3px 1fr;height:calc(100vh - 280px);min-height:400px;}
  @media(max-width:900px){.board{grid-template-columns:1fr;height:auto;}.divider{display:none;}}
  .divider{background:var(--line);}
  .col{overflow-y:auto;padding:20px 22px 60px;}
  .col::-webkit-scrollbar{width:6px;}
  .col::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .col-title{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
  .col-title .dot{width:7px;height:7px;border-radius:50%;}
  .right .dot{background:var(--amber);}
  .left .dot{background:var(--teal);}

  /* ---- Stock rows ---- */
  .stock-row{display:flex;align-items:center;gap:14px;padding:13px 15px;margin-bottom:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:transform .15s,border-color .15s;}
  .stock-row:hover{border-color:var(--amber-dim);transform:translateX(-2px);}
  .stock-row .ticker{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;min-width:55px;}
  .stock-row .trend{font-size:17px;width:20px;text-align:center;}
  .trend.up{color:var(--green);}.trend.down{color:var(--red);}
  .stock-row .trigger{flex:1;font-size:13px;color:var(--text-dim);}
  .win-rate-badge{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border:1px solid;border-radius:20px;white-space:nowrap;}
  .bt-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .bt-stat-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center;}
  .bt-stat-card .k{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .bt-stat-card .v{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;}
  .bt-chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;height:260px;margin-bottom:16px;}
  .bt-rs-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
  .bt-rs-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .bt-rs-card .label{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .bt-rs-card .row{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
  .bt-signals-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .bt-signals-table th{text-align:start;color:var(--text-dim);font-weight:600;font-size:10.5px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);}
  .bt-signals-table td{padding:7px 8px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;}
  .bt-signals-table tr:hover td{background:var(--panel-2);}
  .bt-empty{color:var(--text-dim);padding:40px 20px;text-align:center;font-size:13px;line-height:1.6;}
  .dd-search-row{display:flex;gap:8px;margin-bottom:18px;}
  .dd-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .dd-header .ticker{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;}
  .dd-header .name{color:var(--text-dim);font-size:13px;margin-inline-start:8px;}
  .dd-header .price{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
  .dd-chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:16px;height:340px;}
  .dd-stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
  .dd-stat-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center;}
  .dd-stat-card .k{font-size:10px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;}
  .dd-stat-card .v{font-family:'JetBrains Mono',monospace;font-size:14.5px;font-weight:700;}
  .dd-section-title{font-size:13px;font-weight:700;margin:20px 0 10px;color:var(--text);}
  .dd-sector-compare{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
  .dd-sector-compare .col{flex:1;text-align:center;}
  .dd-sector-compare .col .k{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .dd-sector-compare .col .v{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;}
  .dd-news-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .dd-news-item a{color:var(--text);text-decoration:none;font-size:13px;line-height:1.5;}
  .dd-news-item a:hover{color:var(--teal);}
  .dd-news-item .meta{font-size:10.5px;color:var(--text-dim);margin-top:3px;}
  .cs-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .cs-input-wrap{position:relative;margin-bottom:8px;}
  .cs-input-icon{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:12px;font-size:13px;color:var(--text-dim);pointer-events:none;}
  .cs-input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;padding-inline-start:34px;font-size:14px;outline:none;font-family:'JetBrains Mono',monospace;}
  .cs-input:focus{border-color:var(--teal-dim);}
  .cs-list{max-height:320px;overflow-y:auto;margin-top:6px;}
  .cs-item{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:8px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--line);}
  .cs-item:last-child{border-bottom:none;}
  .cs-item:hover{background:var(--panel-2);}
  .cs-item .cs-ticker{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px;min-width:52px;}
  .cs-item .cs-trigger{font-size:11.5px;color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cs-empty{color:var(--text-dim);font-size:12.5px;padding:14px 4px;text-align:center;}
  .cs-freeform{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;}
  .score-badge{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;padding:4px 9px;border-radius:20px;min-width:36px;text-align:center;}
  .repeat-badge{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:10px;padding:3px 7px;border-radius:20px;background:rgba(232,163,61,.12);color:var(--amber);white-space:nowrap;}
  .score-hi{background:rgba(62,207,126,.15);color:var(--green);}
  .score-mid{background:rgba(232,163,61,.15);color:var(--amber);}
  .stock-group-title{font-size:12px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin:4px 2px 9px;padding:8px 6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;border-radius:6px;transition:background .15s;}
  .stock-group-title:hover{background:var(--panel-2);}
  .stock-group-title.first{margin-top:0;padding-top:0;}
  .stock-group-title.previous{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;}
  .group-arrow{font-size:22px;line-height:1;transition:transform .15s;color:var(--text);font-weight:700;padding:2px 6px;}
  .group-arrow.collapsed{transform:rotate(-90deg);}

  /* ---- Macro items ---- */
  .macro-item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .macro-item:hover .macro-text{color:var(--amber);}
  .macro-tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;height:fit-content;white-space:nowrap;}
  .tag-critical{background:rgba(239,91,91,.15);color:var(--red);}
  .tag-high{background:rgba(53,179,163,.15);color:var(--teal);}
  .macro-text{font-size:13.5px;line-height:1.5;transition:color .15s;}
  .macro-time{color:var(--text-dim);font-size:11px;margin-top:3px;}
  .macro-hook{font-size:11.5px;color:var(--amber);line-height:1.4;margin-top:4px;opacity:.9;}
  .breaking-card .b-hook{font-size:11px;color:var(--amber);line-height:1.4;margin-top:5px;opacity:.9;}

  /* ---- Drawer ---- */
  .overlay{position:fixed;inset:0;background:rgba(6,8,10,.6);backdrop-filter:blur(2px);display:none;align-items:stretch;justify-content:flex-start;z-index:50;}
  .overlay.open{display:flex;}
  .drawer{width:min(460px,92vw);background:var(--panel-2);height:100%;border-left:1px solid var(--line);padding:24px 22px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s ease;}
  .overlay.open .drawer{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .drawer-head h2{font-family:'JetBrains Mono',monospace;font-size:22px;margin:0;}
  .close-btn{background:none;border:1px solid var(--line);color:var(--text-dim);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;}
  .close-btn:hover{color:var(--text);}
  .tv-chart-box{height:260px;border-radius:10px;overflow:hidden;margin-bottom:16px;background:var(--panel);direction:ltr;}
  .news-section{margin-bottom:16px;}
  .news-item{padding:9px 0;border-bottom:1px solid var(--line);}
  .news-item a{color:var(--text);font-size:13px;text-decoration:none;line-height:1.5;display:block;}
  .news-item a:hover{color:var(--amber);}
  .gauge-wrap{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .gauge-num{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600;}
  .gauge-label{color:var(--text-dim);font-size:12px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
  .stat .k{color:var(--text-dim);font-size:11px;margin-bottom:3px;}
  .stat .v{font-family:'JetBrains Mono',monospace;font-size:14px;}
  .ai-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13px;line-height:1.6;margin-bottom:16px;}
  .trend-stage-badge{display:inline-block;padding:4px 11px;border:1px solid;border-radius:20px;font-size:11px;font-weight:700;margin:2px 0 10px;}
  .trend-ma-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;}
  .trend-ma-row:last-child{border-bottom:none;}
  .pattern-stats-blurb{margin-top:10px;padding:9px 11px;border-inline-start:3px solid;border-radius:6px;background:var(--panel-2);font-size:12px;line-height:1.5;color:var(--text-dim);}
  .risk-calc-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:16px;}
  .risk-calc-overlay.open{display:flex;}
  .risk-calc-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;}
  .risk-calc-modal h3{margin:0 0 14px;font-size:16px;}
  .risk-field{margin-bottom:12px;}
  .risk-field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;}
  .risk-field input{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;}
  .risk-field input:focus{outline:none;border-color:var(--amber);}
  .risk-calc-results{margin-top:14px;padding:13px;background:var(--panel-2);border-radius:10px;border:1px solid var(--line);}
  .risk-result-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line);}
  .risk-result-row:last-child{border-bottom:none;}
  .risk-result-row .v{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .risk-calc-warning{margin-top:10px;font-size:11.5px;color:var(--red);line-height:1.5;}
  .risk-calc-close{display:block;width:100%;text-align:center;padding:10px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--text-dim);cursor:pointer;font-size:12.5px;margin-top:14px;font-family:'Heebo',sans-serif;}
  .risk-calc-close:hover{color:var(--text);border-color:var(--text-dim);}
  .info-badge-btn{background:var(--panel);border:1px solid var(--line);color:var(--amber);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;transition:border-color .15s;}
  .info-badge-btn:hover{border-color:var(--amber);}
  .info-accordion-item{border-bottom:1px solid var(--line);}
  .info-accordion-item:last-of-type{border-bottom:none;}
  .info-accordion-head{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;cursor:pointer;font-size:13px;font-weight:600;color:var(--amber);user-select:none;}
  .info-accordion-body{padding:0 2px 12px;font-size:12.5px;line-height:1.6;color:var(--text-dim);}
  .info-source-list{margin:8px 0;padding-inline-start:18px;}
  .info-source-list li{margin-bottom:3px;}
  .ai-box .label{color:var(--amber);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
  .deep-btn{display:block;width:100%;text-align:center;padding:11px;border-radius:9px;background:var(--amber);color:#1a1300;font-weight:700;border:none;cursor:pointer;font-size:14px;}

  .sector-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}

// Small inline badge showing this pattern's historical win-rate, so the

function winRateBadgeHtml(patternType){
  if(!patternType || !patternStatsCache) return '';
  const stat = patternStatsCache[patternType];
  if(!stat || stat.win_rate_10d == null) return '';
  const wr = stat.win_rate_10d;
  const color = wr>=55 ? 'var(--green)' : wr>=45 ? 'var(--amber)' : 'var(--red)';
  const title = lang==='en'
    ? `${patternType}: profitable ${wr}% of the time historically (${stat.n} past signals)`
    : `${patternType}: רווחי ב-${wr}% מהמקרים היסטורית (${stat.n} איתותים קודמים)`;

function stockRowHtml(s,i){
  return `
    <div class="stock-row" onclick="openDrawer(${i})">
      <div class="ticker">${s.ticker}</div>

// Shows how many times this ticker has actually re-qualified in the last
// 14 days, so a stock that keeps showing up reads as "still strong" rather
// than a mysterious repeat. Silent for fresh (count<=1) signals.
function repeatBadgeHtml(count){
  if(!count || count <= 1) return '';
  const label = lang==='en' ? `${count}× in 14d` : `${count}× ב-14 יום`;
  return `<div class="repeat-badge" title="${lang==='en'?'Re-qualified '+count+' times in the last 14 days':'הופיעה שוב '+count+' פעמים ב-14 הימים האחרונים'}">${label}</div>`;

let activeSector = 'הכל';
let newsSearchQuery = '';
let newsSearchResults = null;   // null = not searching, use normal `macro` feed. array = search mode.
let newsSearchDebounce = null;
let newsSearchToken = 0;        // guards against out-of-order responses (slow request landing after a newer one)

function setNewsSearch(value){
  newsSearchQuery = value.trim();
  const clearBtn = document.getElementById('news-search-clear');
  const icon = document.getElementById('news-search-icon');
  if(clearBtn) clearBtn.style.display = newsSearchQuery ? 'block' : 'none';
  if(icon) icon.style.display = newsSearchQuery ? 'none' : 'block';

  clearTimeout(newsSearchDebounce);
  if(!newsSearchQuery){
    newsSearchResults = null;
    renderMacro();
    return;
  }
  // Debounce: wait for a pause in typing before hitting the server,
  // and search a wide 7-day window (not just the ~25 items shown in the feed)
  newsSearchDebounce = setTimeout(() => runNewsSearch(newsSearchQuery), 350);
}

async function runNewsSearch(query){
  const myToken = ++newsSearchToken;
  const el = document.getElementById('macro');
  if(el) el.innerHTML = `<div style="color:var(--text-dim);padding:20px;text-align:center;">${UI[lang].loading}</div>`;
  try {
    const res = await fetch(`${API_BASE}/api/macro-news/search?q=${encodeURIComponent(query)}&days=7&limit=60`);
    if(!res.ok) throw new Error('search failed');
    const rows = await res.json();
    if(myToken !== newsSearchToken) return; // a newer search has since started, ignore this stale response
    newsSearchResults = rows.map(mapDbRowToMacro);
    renderMacro();
  } catch(e){
    console.error('[news search] failed', e);
    if(myToken !== newsSearchToken) return;
    newsSearchResults = [];
    renderMacro();
  }
}

function clearNewsSearch(){
  newsSearchQuery = '';
  newsSearchResults = null;
  newsSearchToken++; // invalidate any in-flight search response
  const input = document.getElementById('news-search-input');
  if(input) input.value = '';
  const clearBtn = document.getElementById('news-search-clear');
  const icon = document.getElementById('news-search-icon');
  if(clearBtn) clearBtn.style.display = 'none';
  if(icon) icon.style.display = 'block';
  renderMacro();
}

let deepDiveTvChart = null;

async function loadDeepDive(){
  const input = document.getElementById('dd-ticker-input');
  const ticker = (input.value || '').trim().toUpperCase();
  const el = document.getElementById('deepdive-content');
  const t = lang === 'en';

  if(!ticker){
    el.innerHTML = `<div class="bt-empty">${t?'Enter a ticker to see full analysis.':'הקלד טיקר כדי לראות ניתוח מלא.'}</div>`;
    return;
  }

  el.innerHTML = `<div class="bt-empty">${UI[lang].loading}</div>`;

  try {
    const [lookupRes, sectorRes, signalsRes, newsRes, fundRes] = await Promise.allSettled([
      fetch(`${API_BASE}/api/lookup/${ticker}`).then(r => r.ok ? r.json() : Promise.reject()),
      fetchWithTimeout(`${API_BASE}/api/sector-comparison/${ticker}`, 30000).then(r => r.ok ? r.json() : Promise.reject()),
      fetch(`${API_BASE}/api/signal-history/${ticker}`).then(r => r.ok ? r.json() : Promise.reject()),
      fetch(`${API_BASE}/api/stock-news/${ticker}`).then(r => r.ok ? r.json() : Promise.reject()),
      fetchFundamentalsData(ticker),
    ]);

    if(lookupRes.status !== 'fulfilled'){
      el.innerHTML = `<div class="bt-empty">${t?`Couldn't find ticker "${ticker}".`:`הטיקר "${ticker}" לא נמצא.`}</div>`;
      return;
    }

    const quote = lookupRes.value;
    const sector = sectorRes.status === 'fulfilled' ? sectorRes.value : null;
    const signals = signalsRes.status === 'fulfilled' ? signalsRes.value : [];
    const news = newsRes.status === 'fulfilled' ? newsRes.value : [];
    const fundData = fundRes.status === 'fulfilled' ? fundRes.value : null;

    // The lookup endpoint's own market_cap/pe_ratio depend on yfinance's
    // often-blocked .info — fundamentals computes both more reliably from
    // SEC data. Prefer that for the header stat cards whenever it's there.
    if(fundData){
      if(quote.market_cap == null && fundData.market_cap != null) quote.market_cap = fundData.market_cap;
      if(quote.pe_ratio == null && fundData.trailing_pe != null) quote.pe_ratio = fundData.trailing_pe;
      // Keep NTM (forward) and LTM (trailing) separately so the header
      // P/E stat can default to NTM with a toggle to LTM, instead of
      // collapsing to one number. Forward P/E is an analyst estimate —
      // yfinance .info-only, no SEC equivalent — so it can legitimately
      // be unavailable even when LTM isn't.
      quote.pe_ratio_ntm = fundData.forward_pe ?? null;
      quote.pe_ratio_ltm = fundData.trailing_pe ?? quote.pe_ratio ?? null;
    }

    renderDeepDive(quote, sector, signals, news);
    if(fundData){
      try { renderFundamentals(fundData, 'dd-fundamentals-section'); }
      catch(e){ console.error('[fundamentals] render failed for', quote.ticker, e); loadFundamentals(quote.ticker, 'dd-fundamentals-section'); }
    } else {
      // The parallel attempt above failed — retry independently, and if
      // it succeeds this time, back-fill the header P/E card too (it
      // rendered already with "—" since fundData wasn't ready yet).
      loadFundamentals(quote.ticker, 'dd-fundamentals-section').then(retryData => {
        if(retryData && _dd_lastQuote === quote){
          quote.pe_ratio_ntm = retryData.forward_pe ?? null;
          quote.pe_ratio_ltm = retryData.trailing_pe ?? quote.pe_ratio ?? null;
          if(quote.market_cap == null) quote.market_cap = retryData.market_cap;
          renderDeepDivePeCard();
        }
      });
    }

function formatMarketCap(n){
  if(n == null) return '—';
  n = Number(n);
  if(n >= 1e12) return (n/1e12).toFixed(2)+'T';
  if(n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if(n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if(n >= 1e3) return (n/1e3).toFixed(0)+'K';
  return String(n);
}

async function loadHeatmap(idx){
  const el = document.getElementById('heatmap-grid');
  const t = lang==='en';
  if(el) el.innerHTML = `<div class="movers-empty">${UI[lang].loading}</div>`;
  // Same cold-start issue as the main dashboard load: a single fetch right
  // after the tab is opened can land while Render is still waking up.
  // Retry a few times with growing waits before giving up.
  const waits = [0, 4000, 10000];
  for(let i=0; i<waits.length; i++){
    if(waits[i]) await new Promise(r=>setTimeout(r, waits[i]));
    try {
      const res = await fetchWithTimeout(`${API_BASE}/api/heatmap?index=${idx}`, 15000);
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      renderHeatmap(data.stocks || []);
      return;
    } catch(e) {
      console.warn(`[heatmap] attempt ${i+1}/${waits.length} failed`, e);
    }
  }
  if(el) el.innerHTML = `<div class="movers-empty">${t?'Could not load heatmap.':'לא ניתן לטעון מפת חום.'} <span style="text-decoration:underline;cursor:pointer" onclick="loadHeatmap('${idx}')">${t?'Try again':'נסה שוב'}</span></div>`;
  pulseLoaded = false; // allow a fresh attempt next time this tab is opened
}

function heatmapColor(pct){
  // Green for gains, red for losses, intensity scaled by magnitude (capped at ±4% for saturation)
  const clamped = Math.max(-4, Math.min(4, pct));
  const intensity = Math.abs(clamped) / 4; // 0..1
  if(pct >= 0){
    const g = Math.round(60 + intensity*80);
    return `rgb(${Math.round(30+intensity*20)},${g+70},${Math.round(60+intensity*40)})`;
  }
  const r = Math.round(120 + intensity*100);
  return `rgb(${r},${Math.round(40+intensity*20)},${Math.round(50+intensity*20)})`;
}

function renderHeatmap(stocks){
  const el = document.getElementById('heatmap-grid');
  if(!el) return;
  if(!stocks.length){
    el.innerHTML = `<div class="movers-empty">${lang==='en'?'No heatmap data yet — check back after the next scan.':'עדיין אין נתוני מפת חום — נסה שוב אחרי הסריקה הבאה.'}</div>`;
    return;
  }
  el.innerHTML = stocks.map(s=>{
    const pct = s.change_pct==null ? 0 : s.change_pct;
    const sign = pct>=0 ? '+' : '';
    return `<div class="heatmap-tile" style="background:${heatmapColor(pct)}" onclick="showTickerDrawer('${s.ticker}')">
      <div class="ticker">${s.ticker}</div>
      <div class="pct">${sign}${pct.toFixed(1)}%</div>
    </div>`;
  }).join('');
}

async function loadSectorPerformance(period){

function renderSectorChart(data){
  const canvas = document.getElementById('sector-chart-canvas');
  if(!canvas || typeof Chart === 'undefined') return;
  if(sectorChartInstance){ sectorChartInstance.destroy(); sectorChartInstance = null; }
  const datasets = (data.series||[]).map((s,i)=>({
    label: s.ticker,
    data: s.values,
    borderColor: SECTOR_COLORS[i % SECTOR_COLORS.length],
    backgroundColor: 'transparent',
    borderWidth: 1.5,
    pointRadius: 0,
    tension: .15,
    spanGaps: true,
  }));
  sectorChartInstance = new Chart(canvas, {
    type: 'line',
    data: { labels: data.dates||[], datasets },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'nearest', intersect:false },
      plugins:{
        // Clicking a legend chip hides/shows that sector's line — this is
        // Chart.js's built-in behavior and mirrors Koyfin's removable tags.
        legend:{ position:'top', labels:{ boxWidth:10, boxHeight:10, font:{size:10}, color:'#8a93a3', padding:8 } },
        tooltip:{ callbacks:{ label:(ctx)=>`${ctx.dataset.label}: ${ctx.parsed.y>=0?'+':''}${ctx.parsed.y.toFixed(2)}%` } },
      },
      scales:{
        x:{ grid:{display:false}, ticks:{ font:{size:9}, maxRotation:0, autoSkip:true, maxTicksLimit:8 } },
        y:{ position:'right', grid:{color:'rgba(255,255,255,0.06)'}, ticks:{ font:{size:9}, callback:(v)=>v+'%' } },
      }
    }
  });
}

}

// ---- Position size / risk calculator ----
// Pure client-side math, no backend involved — the user re-enters their
// current total account equity every time (not a stored fixed value),
// since that's the only honest way to size risk: it has to reflect what
// the account is actually worth right now, including whatever's tied up
// in other open positions.
function openRiskCalc(prefill){
  prefill = prefill || {};

function recalcRisk(){
  const t = lang==='en';
  const equityEl = document.getElementById('rc-equity');
  if(!equityEl) return;
  const equity = parseFloat(equityEl.value);
  const riskPct = parseFloat(document.getElementById('rc-risk-pct').value);
  const entry = parseFloat(document.getElementById('rc-entry').value);
  const stop = parseFloat(document.getElementById('rc-stop').value);
  const targetRaw = document.getElementById('rc-target').value;
  const target = targetRaw ? parseFloat(targetRaw) : null;

  if(!isNaN(equity)) localStorage.setItem('riskCalcEquity', equity);
  if(!isNaN(riskPct)) localStorage.setItem('riskCalcRiskPct', riskPct);

  const resultsEl = document.getElementById('risk-calc-results');
  if(!resultsEl) return;

  if(isNaN(equity) || isNaN(riskPct) || isNaN(entry) || isNaN(stop) || equity<=0 || entry<=0){
    resultsEl.innerHTML = `<div style="color:var(--text-dim);font-size:12.5px;">${t?'Fill in equity, risk %, entry and stop to calculate.':'מלא שווי תיק, אחוז סיכון, כניסה וסטופ כדי לחשב.'}</div>`;
    return;
  }
  const riskPerShare = entry - stop;
  if(riskPerShare <= 0){
    resultsEl.innerHTML = `<div class="risk-calc-warning">${t?'Stop must be below entry (for a long position).':'הסטופ חייב להיות מתחת למחיר הכניסה (בפוזיציית לונג).'}</div>`;
    return;
  }
  const riskAmount = equity * (riskPct/100);
  const shares = Math.floor(riskAmount / riskPerShare);
  const positionSize = shares * entry;
  const pctOfAccount = (positionSize / equity) * 100;
  let rMultipleRow = '';
  if(target!=null && !isNaN(target)){
    const rMultiple = (target - entry) / riskPerShare;
    rMultipleRow = `<div class="risk-result-row"><span>${t?'Risk/Reward (R)':'יחס סיכוי/סיכון'}</span><span class="v">1:${rMultiple.toFixed(1)}</span></div>`;
  }
  let warning = '';
  if(shares<=0){
    warning = `<div class="risk-calc-warning">${t?'Risk amount too small for even 1 share at this stop distance.':'סכום הסיכון קטן מדי אפילו למניה אחת במרחק הסטופ הזה.'}</div>`;
  } else if(pctOfAccount > 25){
    warning = `<div class="risk-calc-warning">${t?'⚠️ This position would be over 25% of your account — consider a wider stop or smaller risk %.':'⚠️ הפוזיציה הזו תהיה מעל 25% מהתיק — שקול סטופ רחוק יותר או אחוז סיכון נמוך יותר.'}</div>`;
  }
  resultsEl.innerHTML = `
    <div class="risk-result-row"><span>${t?'Risk Amount':'סכום הסיכון'}</span><span class="v">$${riskAmount.toFixed(0)}</span></div>
    <div class="risk-result-row"><span>${t?'Risk per Share':'סיכון למניה'}</span><span class="v">$${riskPerShare.toFixed(2)}</span></div>
    <div class="risk-result-row"><span>${t?'Shares to Buy':'מניות לקנייה'}</span><span class="v">${shares}</span></div>
    <div class="risk-result-row"><span>${t?'Position Size':'גודל הפוזיציה'}</span><span class="v">$${positionSize.toFixed(0)}</span></div>
    <div class="risk-result-row"><span>${t?'% of Account':'אחוז מהתיק'}</span><span class="v">${pctOfAccount.toFixed(1)}%</span></div>
    ${rMultipleRow}
    ${warning}
  `;
}

async function promptAddToWatchlist(){
  const t = lang==='en';
  const raw = prompt(t?'Ticker to add to your watchlist:':'טיקר להוספה לרשימת המעקב:');
  if(!raw) return;
  const ticker = raw.trim().toUpperCase();
  if(!ticker) return;
  try {
    const res = await fetch(`${API_BASE}/api/watchlist`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticker }),
    });
    if(!res.ok) throw new Error('add failed');
    track('watchlist_add', ticker);
    await refreshWatchlistData();
    if(moversPanelMode === 'watchlist') renderWatchlistPanel();
    // keep any open drawer's star in sync if this ticker happens to be showing
    const starEl = document.getElementById(`watchlist-star-${ticker}`);
    if(starEl) starEl.classList.add('active');
  } catch(e) {
    console.error('[watchlist] prompt-add failed', e);
    alert(t?'Could not add that ticker — check the symbol and try again.':'לא ניתן היה להוסיף את הטיקר — בדוק את הסימול ונסה שוב.');
  }
}

async function refreshWatchlistData(){
  try {
    const res = await fetch(`${API_BASE}/api/watchlist`);
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    latestWatchlistData = Array.isArray(data) ? data : [];
    watchlistTickers = new Set(latestWatchlistData.map(r=>r.ticker));
    return true;
  } catch(e) {
    console.error('[watchlist] load failed', e);
    return false;
  }
}

async function loadWatchlist(){
  const el = document.getElementById('movers-list');
  document.getElementById('movers-title').textContent = lang==='en' ? 'Watchlist' : 'רשימת מעקב';
  if(el) el.innerHTML = `<div class="movers-empty">${UI[lang].loading}</div>`;
  const ok = await refreshWatchlistData();
  if(!ok && el){
    el.innerHTML = `<div class="movers-empty">${lang==='en'?'Could not load watchlist.':'לא ניתן לטעון את רשימת המעקב.'}</div>`;
    return;
  }
  renderWatchlistPanel();
}

function renderWatchlistPanel(){
  const el = document.getElementById('movers-list');
  if(!el) return;
  if(!latestWatchlistData.length){
    el.innerHTML = `<div class="movers-empty">${lang==='en'?"No tickers yet — tap + above to add one.":'עדיין אין מניות ברשימת המעקב — לחץ על + למעלה כדי להוסיף אחת.'}</div>`;
    return;
  }
  el.innerHTML = latestWatchlistData.map(r=>{
    const has = r.price!=null;
    const cls = has && r.change_pct>=0 ? 'up' : 'down';
    const sign = has && r.change_pct>=0 ? '+' : '';
    const name = r.name && r.name!==r.ticker ? r.name : '';
    const atrText = r.atr_pct!=null ? ` · ATR ${r.atr_pct}%` : '';
    return `
      <div class="mover-row" onclick="showTickerDrawer('${r.ticker}')">
        <div class="mover-ticker">${r.ticker}</div>
        <div class="mover-trigger">${name?name+' · ':''}${has ? '$'+r.price : (lang==='en'?'price unavailable':'מחיר לא זמין')}${atrText}</div>
        <div class="mover-pct ${cls}">${has ? sign+r.change_pct.toFixed(2)+'%' : '—'}</div>
      </div>
    `;
  }).join('');
}

async function toggleWatchlist(ticker){
  const starEl = document.getElementById(`watchlist-star-${ticker}`);
  const isActive = watchlistTickers.has(ticker);
  try {
    if(isActive){
      const res = await fetch(`${API_BASE}/api/watchlist/${ticker}`, { method: 'DELETE' });
      if(!res.ok) throw new Error('delete failed');
      watchlistTickers.delete(ticker);
      latestWatchlistData = latestWatchlistData.filter(r=>r.ticker!==ticker);
    } else {
      const res = await fetch(`${API_BASE}/api/watchlist`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker }),
      });
      if(!res.ok) throw new Error('add failed');
      watchlistTickers.add(ticker);
      latestWatchlistData.unshift({ ticker, price: null, change_pct: null });
      track('watchlist_add', ticker);
    }
    if(starEl) starEl.classList.toggle('active', !isActive);
    if(moversPanelMode === 'watchlist') renderWatchlistPanel();
  } catch(e) {
    console.error('[watchlist] toggle failed', e);
  }
}

  activeFundCharts.forEach(c=>{ try{ c.destroy(); }catch(e){} });
  activeFundCharts = [];
}

function fundChartCanvas(id){
  return `<div class="fund-scroll"><canvas id="${id}" style="display:block;"></canvas></div>`;
}

// Fund charts are often wider than their container (one column per quarter)
// and scroll horizontally. Left unset, the scroll position defaults
// inconsistently across browsers on this RTL page — sometimes landing on
// the oldest data instead of the most recent. Force it to the most recent
// (right/end) explicitly every time a chart is (re)built.
function scrollFundChartToEnd(canvasEl){
  const wrap = canvasEl && canvasEl.parentElement;
  if(!wrap) return;
  const goToEnd = () => { wrap.scrollLeft = wrap.scrollWidth; };
  requestAnimationFrame(()=>{
    requestAnimationFrame(goToEnd);
  });
  // A fixed delay was a guess at how long the drawer's open transition
  // takes, and guessing wrong (transition longer than the delay, or a
  // slower device) meant landing back on the oldest data. ResizeObserver
  // re-corrects scrollLeft every time this container's actual size
  // changes — covering the drawer transition, font loading, or anything
  // else that reflows it — for up to 2s, then stops watching.
  if(window.ResizeObserver){
    let watching = true;
    const ro = new ResizeObserver(()=>{ if(watching) goToEnd(); });
    ro.observe(wrap);
    setTimeout(()=>{ watching = false; ro.disconnect(); }, 2000);
  } else {
    setTimeout(goToEnd, 350); // older browser fallback
  }
}

// Formats a raw number into a compact, human-readable form for chart axes
// and tooltips — e.g. 186000000000 -> "$186.00B" instead of the full digit
// string, which is unreadable on a hover tooltip or a cramped y-axis.
function fmtCompactMoney(v){
  if(v==null || isNaN(v)) return '—';
  const sign = v<0 ? '-' : '';
  const abs = Math.abs(v);
  if(abs>=1e9) return sign+'$'+(abs/1e9).toFixed(2)+'B';
  if(abs>=1e6) return sign+'$'+(abs/1e6).toFixed(2)+'M';
  if(abs>=1e3) return sign+'$'+(abs/1e3).toFixed(1)+'K';
  return sign+'$'+abs.toFixed(2);
}
// Same idea but without the $ sign and fewer decimals — used in the tight
// compare-table "trend" line where space is at a premium.
function fmtCompactShort(v){
  if(v==null) return '';
  const sign = v<0 ? '-' : '';
  const abs = Math.abs(v);
  if(abs>=1e9) return sign+(abs/1e9).toFixed(1)+'B';
  if(abs>=1e6) return sign+(abs/1e6).toFixed(1)+'M';
  if(abs>=1e3) return sign+(abs/1e3).toFixed(0)+'K';
  return sign+abs.toFixed(1);
}

function fundBarOptions(valueFormatter){
  return {
    responsive:false, maintainAspectRatio:false,
    plugins:{
      legend:{ display:false }, // replaced by a fixed HTML legend — see fundLegendHtml()
      tooltip: valueFormatter ? { callbacks:{ label:(ctx)=>`${ctx.dataset.label}: ${valueFormatter(ctx.parsed.y)}` } } : {},
    },
    scales:{
      x:{ grid:{display:false}, ticks:{font:{size:9}, maxRotation:0, autoSkip:true, maxTicksLimit:12} },
      y:{ position:'right', grid:{color:'rgba(255,255,255,0.06)'}, ticks:{font:{size:9}, callback: valueFormatter ? (v)=>valueFormatter(v) : undefined} },
    }
  };
}
function fundLineOptions(valueFormatter){
  return {
    responsive:false, maintainAspectRatio:false,
    plugins:{
      legend:{ display:false },
      tooltip: valueFormatter ? { callbacks:{ label:(ctx)=>`${ctx.dataset.label}: ${valueFormatter(ctx.parsed.y)}` } } : {},
    },
    scales:{
      x:{ grid:{display:false}, ticks:{font:{size:8}, maxRotation:0, autoSkip:true, maxTicksLimit:8} },
      y:{ position:'right', grid:{color:'rgba(255,255,255,0.06)'}, ticks:{font:{size:9}, callback: valueFormatter ? (v)=>valueFormatter(v) : undefined} },
    }
  };
}

// A fixed HTML legend that sits above the scrollable chart, instead of
// Chart.js's built-in legend — which renders relative to the chart's OWN
// (very wide) canvas coordinate space, so in a horizontally-scrolling +
// RTL layout it ends up positioned off-screen until scrolled to just the
// right spot. This is always visible regardless of scroll position.
function fundLegendHtml(items){
  return `<div class="fund-legend">${items.map(it=>
    `<span class="fund-legend-item"><span class="fund-legend-dot" style="background:${it.color}"></span>${it.label}</span>`
  ).join('')}</div>`;
}

function fundInfoIcon(key){
  const tip = FUND_TIPS[key];
  if(!tip) return '';
  const text = (lang==='en') ? tip.en : tip.he;
  return `<span class="fund-info" onclick="toggleFundTip(event,this)">i<span class="fund-tip">${text}</span></span>`;
}

function toggleFundTip(ev, iconEl){
  ev.stopPropagation();
  const tip = iconEl.querySelector('.fund-tip');
  const wasOpen = tip.classList.contains('show');
  document.querySelectorAll('.fund-tip.show').forEach(t=>t.classList.remove('show'));
  document.querySelectorAll('.fund-info.open').forEach(i=>i.classList.remove('open'));
  if(!wasOpen){ tip.classList.add('show'); iconEl.classList.add('open'); }
}
document.addEventListener('click', ()=>{
  document.querySelectorAll('.fund-tip.show').forEach(t=>t.classList.remove('show'));
  document.querySelectorAll('.fund-info.open').forEach(i=>i.classList.remove('open'));
});

// Fetches fundamentals with retry (cold-start tolerant) and returns the
// parsed data, or throws. Factored out of loadFundamentals so the header
// stat cards (market cap / P/E) can also use this data directly instead
// of the previous approach, which pulled from a fundamentals cache that
// was almost always still empty at that point (fundamentals used to load
// as a separate, later call) — so the header kept showing "—" even
// though the fundamentals card further down the page had the real number.
async function fetchFundamentalsData(ticker){
  const waits = [0, 6000];
  let lastErr;
  for(let i=0; i<waits.length; i++){
    if(waits[i]) await new Promise(r=>setTimeout(r, waits[i]));
    try {
      const res = await fetchWithTimeout(`${API_BASE}/api/fundamentals/${ticker}`, 25000);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch(e) {
      lastErr = e;
      console.warn(`[fundamentals] attempt ${i+1}/${waits.length} failed for`, ticker, e);
    }
  }
  throw lastErr;
}

async function loadFundamentals(ticker, containerId){
  containerId = containerId || "fundamentals-section";
  const el = document.getElementById(containerId);
  if(!el) return null;
  const t = lang==='en';
  el.innerHTML = `<div class="fund-section-title">${t?'Fundamentals':'נתונים פונדמנטליים'}</div><div class="fund-empty">${t?'Loading fundamentals...':'טוען נתונים פונדמנטליים...'}</div>`;
  let data;
  try {
    data = await fetchFundamentalsData(ticker);
  } catch(e) {
    el.innerHTML = `<div class="fund-section-title">${t?'Fundamentals':'נתונים פונדמנטליים'}</div><div class="fund-empty">${t?'Could not load fundamentals right now.':'לא ניתן לטעון נתונים פונדמנטליים כרגע.'}</div>`;
    return null;
  }
  try {
    renderFundamentals(data, containerId);
  } catch(e) {
    console.error('[fundamentals] render failed for', ticker, e);
    el.innerHTML = `<div class="fund-section-title">${t?'Fundamentals':'נתונים פונדמנטליים'}</div><div class="fund-empty">${t?'Data loaded but failed to render — check console.':'הנתונים נטענו אך הצגתם נכשלה — בדוק את הקונסול.'}</div>`;
  }
  return data;
}

  destroyFundCharts();

  html += `<div class="fund-card"><div class="fund-card-title">${t?'Revenue / Net Income / FCF':'הכנסות / רווח נקי / FCF'}${fundInfoIcon('rev_ni_fcf')}</div>${fundLegendHtml([
    {color:'#5b8def', label:t?'Revenue':'הכנסות'},
    {color:'#3ecf7e', label:t?'Net Income':'רווח נקי'},
    {color:'#e8a33d', label:'FCF'},
  ])}

    <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;">

      ${data.net_income_ltm!=null?`<span>${t?'Net Income (LTM)':'רווח נקי (LTM)'}: <b style="color:var(--text);">${fmtCompactMoney(data.net_income_ltm)}</b></span>`:''}
      ${data.fcf_ltm!=null?`<span>${t?'FCF (LTM)':'FCF (LTM)'}: <b style="color:var(--text);">${fmtCompactMoney(data.fcf_ltm)}</b></span>`:''}
    </div>
    <div style="font-size:10px;color:var(--text-dim);margin-bottom:10px;">${t?'Bars below are per-quarter — LTM above is the trailing 4-quarter sum, comparable to how most terminals (e.g. Koyfin) report it.':'העמודות למטה הן לפי רבעון — ה-LTM למעלה הוא סכום 4 הרבעונים האחרונים, בדיוק כמו שרוב הטרמינלים (כמו Koyfin) מציגים.'}</div>
  ` : ''}

  html += `<div class="fund-card"><div class="fund-card-title">${t?'Gross Margin %':'שולי רווח גולמי %'}${fundInfoIcon('gross_margin')}</div>${fundChartCanvas('chart-margin')}</div>`;

  const latestShares = data.latest_shares_outstanding;
  html += `<div class="fund-stat-row">
    <div class="fund-stat"><div class="k">${t?'Shares Outstanding':'מניות במחזור'}${fundInfoIcon('shares')}</div><div class="v">${latestShares?(latestShares/1e9).toFixed(2)+'B':'—'}</div></div>
    <div class="fund-stat"><div class="k">${t?'Trailing P/E (LTM)':'מכפיל P/E נוכחי (LTM)'}${fundInfoIcon('pe')}</div><div class="v">${data.trailing_pe?data.trailing_pe.toFixed(1):'—'}</div></div>

  </div>`;

  const secLink = data.cik ? `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${data.cik}&type=10-Q&dateb=&owner=include&count=40` : null;
  html += `<div class="fund-source-note">${t
    ? `All figures come straight from the company's official <b>SEC filings</b> (10-Q/10-K) via SEC EDGAR — the same numbers reported to regulators, not analyst-adjusted. Trailing/Forward P/E and analyst EPS estimates come from Yahoo Finance as a supplementary source.${secLink?` <a href="${secLink}" target="_blank" rel="noopener">View the raw filings on SEC.gov →</a>`:''}`

  }

  el.innerHTML = html;

  if(typeof Chart === 'undefined'){
    // Chart.js didn't load (blocked script, network issue, ad-blocker, etc).

function lastVal(arr){
  if(!Array.isArray(arr)) return null;
  for(let i=arr.length-1;i>=0;i--){ if(arr[i]!=null) return arr[i]; }
  return null;
}
// Last up to `n` non-null values, oldest→newest — used to show a short
// trend (not just the single latest quarter) under each compare value.
function lastN(arr, n){
  if(!Array.isArray(arr)) return [];
  return arr.filter(v=>v!=null).slice(-n);
}
function trendStr(arr, formatter){
  const vals = lastN(arr, 4);
  if(vals.length<2) return '';
  return vals.map(formatter).join(' → ');
}
function cmpRow(label, a, b, fmt, betterHigher=null, trendA='', trendB=''){
  let ca='color:var(--text)', cb='color:var(--text)';
  if(betterHigher!==null && a!=null && b!=null && a!==b){
    const aBetter = betterHigher ? a>b : a<b;
    ca = 'color:'+(aBetter?'var(--green)':'var(--text-dim)');
    cb = 'color:'+(aBetter?'var(--text-dim)':'var(--green)');
  }
  return `<div class="cmp-row">
    <div class="cmp-val" style="${cb}">${b!=null?fmt(b):'—'}${trendB?`<div class="cmp-trend">${trendB}</div>`:''}</div>
    <div class="cmp-label">${label}</div>
    <div class="cmp-val" style="${ca}">${a!=null?fmt(a):'—'}${trendA?`<div class="cmp-trend">${trendA}</div>`:''}</div>
  </div>`;
}

function renderCompareSearchList(baseTicker, query){
  const t = lang==='en';
  const listEl = document.getElementById('cs-list');
  if(!listEl) return;
  const q = (query||'').trim().toUpperCase();
  const pool = (stocks||[]).filter(s => s.ticker && s.ticker.toUpperCase() !== baseTicker.toUpperCase());
  const filtered = q ? pool.filter(s => s.ticker.toUpperCase().includes(q)) : pool;

  if(!filtered.length){
    listEl.innerHTML = q
      ? `<div class="cs-empty">${t?`No match in today's scan — press Enter to look up "${q}" directly.`:`אין התאמה בסריקה של היום — לחץ Enter כדי לחפש את "${q}" ישירות.`}</div>`
      : `<div class="cs-empty">${t?'Start typing a ticker.':'התחל להקליד טיקר.'}</div>`;
    return;
  }

  listEl.innerHTML = filtered.slice(0, 30).map(s => {
    const triggerText = lang==='en' ? (s.trigger_en||s.trigger||'') : (s.trigger||s.trigger_he||'');
    return `

  }).join('');
}

  const t = lang==='en';

  if(!compareEl) return;

  const safeFetch = async (url) => {
    try { const r = await fetchWithTimeout(url, 25000); return r.ok ? await r.json() : null; }
    catch { return null; }
  };

  try {
    const [lookA, lookB, fundA, fundB] = await Promise.all([
      safeFetch(`${API_BASE}/api/lookup/${baseTicker}`),
      safeFetch(`${API_BASE}/api/lookup/${ticker2}`),
      safeFetch(`${API_BASE}/api/fundamentals/${baseTicker}`),
      safeFetch(`${API_BASE}/api/fundamentals/${ticker2}`),
    ]);
    renderCompare(compareEl, baseTicker.toUpperCase(), ticker2, lookA, lookB, fundA, fundB);
    track('compare_stock', `${baseTicker}_vs_${ticker2}`);
  } catch(e) {
    console.error('[compare] failed', e);
    compareEl.innerHTML = `<div class="fund-section-title">${t?'Comparison':'השוואת מניות'}</div><div class="fund-empty">${t?'Could not load comparison right now.':'לא ניתן לטעון השוואה כרגע.'}</div>`;

}

function renderCompare(el, tA, tB, lookA, lookB, fundA, fundB){
  const t = lang==='en';
  const gmA = fundA && Array.isArray(fundA.gross_margin_pct) ? lastVal(fundA.gross_margin_pct) : null;
  const gmB = fundB && Array.isArray(fundB.gross_margin_pct) ? lastVal(fundB.gross_margin_pct) : null;
  const trendLabel = t?'(last 4 quarters)':'(4 רבעונים אחרונים)';

  const rows = [
    cmpRow(t?'Price':'מחיר', lookA?.price, lookB?.price, v=>'$'+v),
    cmpRow(t?'Daily Change %':'שינוי יומי %', lookA?.change_pct, lookB?.change_pct, v=>v.toFixed(2)+'%', true),
    cmpRow(t?'Market Cap':'שווי שוק', lookA?.market_cap, lookB?.market_cap, v=>fmtCompactMoney(v), true),
    cmpRow(t?'Trailing P/E':'מכפיל P/E נוכחי', fundA?.trailing_pe, fundB?.trailing_pe, v=>v.toFixed(1)),
    cmpRow(`${t?'Revenue':'הכנסות'} ${trendLabel}`, lastVal(fundA?.revenue), lastVal(fundB?.revenue), v=>fmtCompactMoney(v), true,
      trendStr(fundA?.revenue, fmtCompactShort), trendStr(fundB?.revenue, fmtCompactShort)),
    cmpRow(`${t?'Net Income':'רווח נקי'} ${trendLabel}`, lastVal(fundA?.net_income), lastVal(fundB?.net_income), v=>fmtCompactMoney(v), true,
      trendStr(fundA?.net_income, fmtCompactShort), trendStr(fundB?.net_income, fmtCompactShort)),
    cmpRow(`FCF ${trendLabel}`, lastVal(fundA?.fcf), lastVal(fundB?.fcf), v=>fmtCompactMoney(v), true,
      trendStr(fundA?.fcf, fmtCompactShort), trendStr(fundB?.fcf, fmtCompactShort)),
    cmpRow(`${t?'Gross Margin %':'שולי רווח גולמי %'} ${trendLabel}`, gmA, gmB, v=>v.toFixed(1)+'%', true,
      trendStr(fundA?.gross_margin_pct, v=>v.toFixed(0)+'%'), trendStr(fundB?.gross_margin_pct, v=>v.toFixed(0)+'%')),
    cmpRow(`${t?'Net Debt':'חוב נטו'} ${trendLabel}`, lastVal(fundA?.net_debt), lastVal(fundB?.net_debt), v=>fmtCompactMoney(v), false,
      trendStr(fundA?.net_debt, fmtCompactShort), trendStr(fundB?.net_debt, fmtCompactShort)),
    cmpRow(`${t?'Diluted EPS':'EPS מדולל'} ${trendLabel}`, lastVal(fundA?.diluted_eps), lastVal(fundB?.diluted_eps), v=>v.toFixed(2), true,
      trendStr(fundA?.diluted_eps, v=>v.toFixed(2)), trendStr(fundB?.diluted_eps, v=>v.toFixed(2))),
  ];

  const noteA = (!lookA && !fundA?.has_fundamentals) ? `<div class="fund-empty">${t?`Couldn't load data for ${tA}.`:`לא ניתן היה לטעון נתונים עבור ${tA}.`}</div>` : '';
  const noteB = (!lookB && !fundB?.has_fundamentals) ? `<div class="fund-empty">${t?`Couldn't load data for ${tB}.`:`לא ניתן היה לטעון נתונים עבור ${tB}.`}</div>` : '';

  el.innerHTML = `
    <div class="fund-section-title">${t?'Comparison':'השוואת מניות'}</div>
    <div class="cmp-head">
      <div class="cmp-ticker">${tB}<span class="cmp-open-full" onclick="showTickerDrawer('${tB}')">${t?'open full ↗':'פתח מלא ↗'}</span></div>
      <div></div>
      <div class="cmp-ticker">${tA}<span class="cmp-open-full" onclick="showTickerDrawer('${tA}')">${t?'open full ↗':'פתח מלא ↗'}</span></div>
    </div>
    ${rows.join('')}
    ${noteA}${noteB}
    <button class="close-compare-btn" onclick="document.getElementById('compare-section').innerHTML=''">${t?'Close comparison':'סגור השוואה'}</button>
  `;
}

const STAGE_HE = {
  'Stage 2 - Uptrend': 'שלב 2 - מגמת עלייה',
  'Stage 1 - Basing': 'שלב 1 - בסיס/איחוד',
  'Stage 3 - Topping': 'שלב 3 - היפוך אפשרי מלמעלה',
  'Stage 4 - Downtrend': 'שלב 4 - מגמת ירידה',
};
const STAGE_COLOR = {
  'Stage 2 - Uptrend': 'var(--green)',
  'Stage 1 - Basing': 'var(--amber)',
  'Stage 3 - Topping': 'var(--amber)',
  'Stage 4 - Downtrend': 'var(--red)',
};

// Trend structure (SMA50/150/200 + Weinstein-style stage) + ATR, shown in
// the stock drawer right under the chart — the "higher level analysis"
// context (is this actually a healthy uptrend, not just an isolated pattern).
function renderTrendBlock(s){
  if(!s.trendStage && s.sma150==null && s.atrValue==null && s.rsRating==null && s.daysToEarnings==null) return '';
  const t = lang==='en';
  const stageLabel = t ? (s.trendStage||'—') : (STAGE_HE[s.trendStage] || s.trendStage || '—');
  const stageColor = STAGE_COLOR[s.trendStage] || 'var(--text-dim)';
  const price = s.entry;
  const maRow = (label, value) => {
    if(value==null) return '';
    const above = price!=null && price > value;
    const color = above ? 'var(--green)' : 'var(--red)';
    const word = above ? (t?'above':'מעל') : (t?'below':'מתחת');
    return `<div class="trend-ma-row"><span>${label}</span><span style="color:${color}">$${value} (${word})</span></div>`;
  };
  let rsRow = '';
  if(s.rsRating!=null){
    const rsColor = s.rsRating>=80 ? 'var(--green)' : s.rsRating>=60 ? 'var(--amber)' : 'var(--red)';
    rsRow = `<div class="trend-ma-row"><span>RS Rating${fundInfoIcon('rs_rating')}</span><span style="color:${rsColor};font-weight:700;">${s.rsRating}</span></div>`;
  }
  let earningsRow = '';
  if(s.daysToEarnings!=null){
    const soon = s.daysToEarnings>=0 && s.daysToEarnings<=7;
    const color = soon ? 'var(--red)' : 'var(--text-dim)';
    const label = t ? 'Earnings' : 'דוחות';
    const valueText = s.daysToEarnings<0
      ? (t?`${-s.daysToEarnings}d ago`:`לפני ${-s.daysToEarnings} ימים`)
      : (t?`in ${s.daysToEarnings}d`:`בעוד ${s.daysToEarnings} ימים`);
    const warn = soon ? ' ⚠️' : '';
    earningsRow = `<div class="trend-ma-row"><span>${label}</span><span style="color:${color};font-weight:${soon?700:400};">${valueText}${warn}</span></div>`;
  }
  return `
    <div class="ai-box trend-box">
      <div class="label">${t?'Trend Structure':'מבנה מגמה'}</div>
      ${s.trendStage ? `<div class="trend-stage-badge" style="color:${stageColor};border-color:${stageColor};">${stageLabel}</div>` : ''}
      ${rsRow}
      ${maRow(t?'SMA 50':'ממוצע 50', s.sma50)}
      ${maRow(t?'SMA 150':'ממוצע 150', s.sma150)}
      ${maRow(t?'SMA 200':'ממוצע 200', s.sma200)}
      ${s.atrValue!=null ? `<div class="trend-ma-row"><span>ATR (14D)</span><span>$${s.atrValue} (${s.atrPct}%)</span></div>` : ''}
      ${earningsRow}
    </div>
  `;
}

function mapDbRowToStock(r){
  return {
    ticker:r.ticker, trend:(r.swing_score>=50)?"up":"down", score:r.swing_score,
    trigger: lang==='en' ? (r.trigger_text_en||r.trigger_text_he) : (r.trigger_text_he||r.trigger_text_en),
    entry:r.entry_price, support:r.support_level,
    resistance:r.resistance_targets, socialSpike:r.social_volume_spike_pct,
    summary: lang==='en' ? (r.ai_summary_en||r.ai_summary_he) : (r.ai_summary_he||r.ai_summary_en),
    summary_he: r.ai_summary_he,
    summary_en: r.ai_summary_en,
    trigger_he: r.trigger_text_he,
    trigger_en: r.trigger_text_en,
    timestamp: r.timestamp,
    changePct: (r.change_pct===null||r.change_pct===undefined) ? null : Number(r.change_pct),
    sma50: r.sma50, sma150: r.sma150, sma200: r.sma200,
    trendStage: r.trend_stage,
    atrValue: r.atr_value, atrPct: r.atr_pct,
    rsRating: r.rs_rating,
    patternType: r.pattern_type,
    daysToEarnings: r.days_to_earnings,
    repeatCount: r.repeat_count_14d || 1,
  };
}

// Given the deduped/ordered stocks array (newest first), mark each row
// isRecent=true if it belongs to the same calendar day as the most recent
// scan, otherwise false (an earlier day's match, kept for context).
function markRecencyGroups(list){
  if(!list.length) return list;
  const latestDay = list[0].timestamp ? new Date(list[0].timestamp).toDateString() : null;
  for(const s of list){
    s.isRecent = latestDay ? (new Date(s.timestamp).toDateString() === latestDay) : true;
  }
  return list;
}

// Keep only the latest row per ticker (rows are already ordered newest-first
// by the API), so a stock flagged both at market open and close only shows once.
function dedupeByTicker(list){
  const seen = new Set();
  const out = [];
  for(const s of list){
    if(seen.has(s.ticker)) continue;
    seen.add(s.ticker);
    out.push(s);
  }
  return out;
}

// Ranks by swing_score blended with the pattern's own historical 10d win
// rate (from patternStatsCache) — a high-score signal from a pattern type
// that has actually paid off historically outranks the same score on a
// pattern with a poor or unproven track record. Patterns with too few
// resolved signals (n<5) fall back to a neutral 50%, so a brand-new/rare
// pattern isn't unfairly punished or boosted before there's real evidence.
// Weighting: 65% score, 35% win rate — score stays the dominant factor,
// win rate breaks ties and nudges close calls.
function compositeRank(s){
  const stat = patternStatsCache && s.patternType ? patternStatsCache[s.patternType] : null;
  const winRate = (stat && stat.n >= 5 && stat.win_rate_10d != null) ? stat.win_rate_10d : 50;
  return (s.score * 0.65) + (winRate * 0.35);
}

function sortByCompositeRank(list){
  return list.slice().sort((a,b)=> compositeRank(b) - compositeRank(a));
}

function mapDbRowToMacro(r){
  return {
    tag: r.category_tag,
    impact: r.impact_level,
    text: lang==='en' ? (r.summary_en||r.summary_he) : (r.summary_he||r.summary_en),
    summary_he: r.summary_he,
    summary_en: r.summary_en,
    hook_he: r.hook_he || '',
    time: new Date(r.timestamp).toLocaleString(lang==='he'?'he-IL':'en-US'),
    source: r.source_url ? new URL(r.source_url).hostname.replace('www.','') : '',
    link: r.source_url||'#',
    sectors: r.category_tag || '',  // use tag as sector fallback until API sends sector data
  };
}

// Render free tier can take 30-60s to wake up from sleep. A plain single
// fetch on page load fails during that window and used to fall back to
// demo data permanently (until a manual refresh happened to land after
// wake-up). fetchWithTimeout + retryFetchPair fix that: several attempts
// with growing waits cover the cold-start window, and a background retry
// keeps trying afterwards so the page self-heals without a manual reload.
function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, {signal: ctrl.signal}).finally(()=>clearTimeout(id));
}

async function tryLoadOnce(timeoutMs){
  const [stocksRes, macroRes] = await Promise.all([
    fetchWithTimeout(`${API_BASE}/api/stocks?limit=60`, timeoutMs),
    fetchWithTimeout(`${API_BASE}/api/macro-news`, timeoutMs),
  ]);
  if(!stocksRes.ok||!macroRes.ok) throw new Error("API error");
  const dbStocks = await stocksRes.json();
  const dbMacro = await macroRes.json();
  if(dbStocks.length>0){ rawStocks = dbStocks; }
  if(dbMacro.length>0){ rawMacro = dbMacro; }
}

let apiConnected = false;
let bgRetryTimer = null;

async function loadFromApi(){
  // Attempts spread out to cover a Render cold-start (usually 30-60s):
  // immediate, then +5s, +12s, +20s waits between tries.
  const waits = [0, 5000, 12000, 20000];
  for(let i=0; i<waits.length; i++){
    if(waits[i]) { setStatus(false, true); await new Promise(r=>setTimeout(r, waits[i])); }
    try {
      await tryLoadOnce(15000);
      apiConnected = true;
      setStatus(true);
      applyLang();
      if(bgRetryTimer){ clearInterval(bgRetryTimer); bgRetryTimer = null; }
      return;
    } catch(e){
      console.warn(`API attempt ${i+1}/${waits.length} failed:`, e);
    }
  }
  // All attempts failed - show demo data but keep trying quietly in the
  // background so the page recovers on its own once the server is up.
  apiConnected = false;
  setStatus(false);
  applyLang();
  startBackgroundRetry();
}

function startBackgroundRetry(){
  if(bgRetryTimer) return;
  bgRetryTimer = setInterval(async ()=>{
    if(apiConnected) { clearInterval(bgRetryTimer); bgRetryTimer = null; return; }
    try {
      await tryLoadOnce(15000);
      apiConnected = true;
      setStatus(true);
      applyLang();
      clearInterval(bgRetryTimer);
      bgRetryTimer = null;
    } catch(e){
      // still down - stay on demo, try again next tick
    }
  }, 30000);
}

    markRecencyGroups(mapped); // must run before the composite sort below —
                                // it relies on mapped[0] being the newest
                                // signal to detect "today's" scan correctly
    const ranked = sortByCompositeRank(mapped);
    for(const s of ranked) stocks.push(s);
  }
  if(rawMacro.length > 0){
    macro.length = 0;
    for(const r of rawMacro){
      macro.push(mapDbRowToMacro(r));
    }
  }

  renderStocks();
  renderMoversOrSectorList();
  renderMacro();
  renderBreakingNews();
  renderSectorFilter();
}
