<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Swing Desk — דשבורד מסחר</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1216;
    --panel: #161a20;
    --panel-2: #1c2129;
    --line: #262c36;
    --text: #eef1f5;
    --text-dim: #8a93a3;
    --amber: #e8a33d;
    --amber-dim: #6b532a;
    --teal: #35b3a3;
    --teal-dim: #1c4b45;
    --green: #3ecf7e;
    --red: #ef5b5b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---- Header ---- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#12151a,#0f1216);
    position:sticky;top:0;z-index:40;
  }
  header .logo{display:flex;align-items:center;gap:10px;}
  header .logo .mark{width:10px;height:10px;border-radius:2px;background:var(--amber);box-shadow:0 0 12px var(--amber);}
  header h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:20px;margin:0;}
  header .sub{color:var(--text-dim);font-size:12px;margin-top:1px;}
  header .clock{color:var(--text-dim);font-size:13px;}
  .search-wrap{display:flex;align-items:center;gap:8px;flex:1;max-width:320px;margin:0 20px;}
  .search-input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;}
  .search-input:focus{border-color:var(--amber-dim);}
  .search-btn{background:var(--amber);color:#1a1300;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;}
  .mobile-search{display:none;padding:10px 16px;gap:8px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  .mobile-search .search-input{flex:1;}
  @media(max-width:900px){.search-wrap{display:none;}.mobile-search{display:flex;}}

  /* ---- Breaking news bar ---- */
  .breaking-bar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 24px 14px;}
  .breaking-bar-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;letter-spacing:1.5px;color:var(--red);text-transform:uppercase;font-weight:700;}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .breaking-items{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;}
  .breaking-items::-webkit-scrollbar{display:none;}
  .breaking-card{flex-shrink:0;max-width:260px;background:rgba(239,91,91,.07);border:1px solid rgba(239,91,91,.2);border-radius:10px;padding:10px 14px;cursor:pointer;transition:border-color .15s;}
  .breaking-card:hover{border-color:rgba(239,91,91,.5);}
  .breaking-card .b-tag{font-size:10px;color:var(--red);font-weight:700;margin-bottom:4px;letter-spacing:1px;}
  .breaking-card .b-text{font-size:13px;line-height:1.45;}

  /* ---- Market charts ---- */
  .market-charts{background:var(--panel-2);border-bottom:1px solid var(--line);padding:12px 24px;}
  .market-charts-title{font-size:11px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .chart-tabs{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
  .chart-tab{padding:5px 13px;border-radius:20px;font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text-dim);transition:all .15s;}
  .chart-tab.active{background:var(--amber);color:#1a1300;border-color:var(--amber);font-weight:700;}
  .chart-tab:hover:not(.active){border-color:var(--amber-dim);color:var(--text);}
  #market-tv-chart{height:220px;border-radius:10px;overflow:hidden;background:var(--panel);}

  .market-charts-row{display:flex;gap:18px;align-items:stretch;}
  .chart-col{flex:1 1 62%;min-width:0;}
  .movers-col{flex:1 1 38%;min-width:0;max-width:340px;display:flex;flex-direction:column;}
  @media(max-width:900px){.market-charts-row{flex-direction:column;}.movers-col{max-width:none;}}
  .movers-title{font-size:11px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .movers-list{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;height:220px;overflow-y:auto;}
  .movers-list::-webkit-scrollbar{width:5px;}
  .movers-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .mover-row{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
  .mover-row:last-child{border-bottom:none;}
  .mover-row:hover .mover-ticker{color:var(--amber);}
  .mover-ticker{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;min-width:52px;transition:color .15s;}
  .mover-trigger{flex:1;font-size:11.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mover-pct{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;min-width:56px;text-align:left;}
  .mover-pct.up{color:var(--green);}
  .mover-pct.down{color:var(--red);}
  .movers-empty{color:var(--text-dim);font-size:12.5px;padding:14px 6px;text-align:center;}

  /* ---- Main board ---- */
  .board{display:grid;grid-template-columns:1fr 3px 1fr;height:calc(100vh - 280px);min-height:400px;}
  @media(max-width:900px){.board{grid-template-columns:1fr;height:auto;}.divider{display:none;}}
  .divider{background:var(--line);}
  .col{overflow-y:auto;padding:20px 22px 60px;}
  .col::-webkit-scrollbar{width:6px;}
  .col::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .col-title{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
  .col-title .dot{width:7px;height:7px;border-radius:50%;}
  .right .dot{background:var(--amber);}
  .left .dot{background:var(--teal);}

  /* ---- Stock rows ---- */
  .stock-row{display:flex;align-items:center;gap:14px;padding:13px 15px;margin-bottom:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:transform .15s,border-color .15s;}
  .stock-row:hover{border-color:var(--amber-dim);transform:translateX(-2px);}
  .stock-row .ticker{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:15px;min-width:55px;}
  .stock-row .trend{font-size:17px;width:20px;text-align:center;}
  .trend.up{color:var(--green);}.trend.down{color:var(--red);}
  .stock-row .trigger{flex:1;font-size:13px;color:var(--text-dim);}
  .score-badge{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;padding:4px 9px;border-radius:20px;min-width:36px;text-align:center;}
  .score-hi{background:rgba(62,207,126,.15);color:var(--green);}
  .score-mid{background:rgba(232,163,61,.15);color:var(--amber);}
  .stock-group-title{font-size:11px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin:4px 2px 9px;padding-top:6px;}
  .stock-group-title.first{margin-top:0;padding-top:0;}
  .stock-group-title.previous{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;}

  /* ---- Macro items ---- */
  .macro-item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .macro-item:hover .macro-text{color:var(--amber);}
  .macro-tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;height:fit-content;white-space:nowrap;}
  .tag-critical{background:rgba(239,91,91,.15);color:var(--red);}
  .tag-high{background:rgba(53,179,163,.15);color:var(--teal);}
  .macro-text{font-size:13.5px;line-height:1.5;transition:color .15s;}
  .macro-time{color:var(--text-dim);font-size:11px;margin-top:3px;}
  .macro-hook{font-size:11.5px;color:var(--amber);line-height:1.4;margin-top:4px;opacity:.9;}
  .breaking-card .b-hook{font-size:11px;color:var(--amber);line-height:1.4;margin-top:5px;opacity:.9;}

  /* ---- Drawer ---- */
  .overlay{position:fixed;inset:0;background:rgba(6,8,10,.6);backdrop-filter:blur(2px);display:none;align-items:stretch;justify-content:flex-start;z-index:50;}
  .overlay.open{display:flex;}
  .drawer{width:min(460px,92vw);background:var(--panel-2);height:100%;border-left:1px solid var(--line);padding:24px 22px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s ease;}
  .overlay.open .drawer{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .drawer-head h2{font-family:'JetBrains Mono',monospace;font-size:22px;margin:0;}
  .close-btn{background:none;border:1px solid var(--line);color:var(--text-dim);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;}
  .close-btn:hover{color:var(--text);}
  .tv-chart-box{height:260px;border-radius:10px;overflow:hidden;margin-bottom:16px;background:var(--panel);}
  .news-section{margin-bottom:16px;}
  .news-item{padding:9px 0;border-bottom:1px solid var(--line);}
  .news-item a{color:var(--text);font-size:13px;text-decoration:none;line-height:1.5;display:block;}
  .news-item a:hover{color:var(--amber);}
  .gauge-wrap{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .gauge-num{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600;}
  .gauge-label{color:var(--text-dim);font-size:12px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;}
  .stat .k{color:var(--text-dim);font-size:11px;margin-bottom:3px;}
  .stat .v{font-family:'JetBrains Mono',monospace;font-size:14px;}
  .ai-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13px;line-height:1.6;margin-bottom:16px;}
  .ai-box .label{color:var(--amber);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
  .deep-btn{display:block;width:100%;text-align:center;padding:11px;border-radius:9px;background:var(--amber);color:#1a1300;font-weight:700;border:none;cursor:pointer;font-size:14px;}

  .sector-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .sector-btn{padding:4px 11px;border-radius:20px;font-size:11.5px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text-dim);transition:all .15s;font-family:'Heebo',sans-serif;}
  .sector-btn.active{background:var(--teal);color:#0a1a18;border-color:var(--teal);font-weight:700;}
  .sector-btn:hover:not(.active){border-color:var(--teal-dim);color:var(--text);}

  .disclaimer-strip{font-size:11px;color:var(--text-dim);text-align:center;padding:10px 24px;border-top:1px solid var(--line);}

  /* ---- Fundamentals (drawer) ---- */
  .fund-section-title{font-size:11px;letter-spacing:1.5px;color:var(--amber);text-transform:uppercase;margin:18px 0 10px;}
  .fund-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px;margin-bottom:12px;}
  .fund-card-title{font-size:12px;color:var(--text-dim);margin-bottom:8px;}
  .fund-scroll{overflow-x:auto;}
  .fund-scroll::-webkit-scrollbar{height:5px;}
  .fund-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .fund-stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .fund-stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;flex:1;min-width:90px;}
  .fund-stat .k{color:var(--text-dim);font-size:10.5px;margin-bottom:2px;}
  .fund-stat .v{font-family:'JetBrains Mono',monospace;font-size:13px;}
  .fund-empty{color:var(--text-dim);font-size:12.5px;padding:10px 2px;}
  .fund-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:11px;color:var(--text-dim);}
  .fund-legend-item{display:flex;align-items:center;gap:5px;}
  .fund-legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .fund-info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--text-dim);font-size:10px;font-weight:700;cursor:pointer;margin-inline-start:6px;user-select:none;vertical-align:middle;}
  .fund-info:hover, .fund-info.open{background:var(--amber);color:#1a1a1a;}
  .fund-tip{display:none;position:absolute;z-index:20;top:20px;inset-inline-start:0;width:230px;background:#1c1f26;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11.5px;line-height:1.45;color:var(--text);font-weight:400;box-shadow:0 6px 18px rgba(0,0,0,.35);text-transform:none;letter-spacing:normal;white-space:normal;}
  .fund-tip.show{display:block;}
  .fund-card-title{position:relative;}
  .fund-source-note{font-size:11px;color:var(--text-dim);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:12px;line-height:1.5;}
  .fund-source-note a{color:var(--amber);text-decoration:none;}
  .fund-source-note a:hover{text-decoration:underline;}

  /* ---- Compare two stocks ---- */
  .compare-btn{display:block;width:100%;text-align:center;padding:11px;border-radius:9px;background:transparent;border:1px solid var(--teal);color:var(--teal);font-weight:700;cursor:pointer;font-size:13px;margin-bottom:16px;font-family:'Heebo',sans-serif;}
  .compare-btn:hover{background:var(--teal);color:#0a1a18;}
  .cmp-head{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;margin-bottom:4px;}
  .cmp-ticker{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px;text-align:center;color:var(--amber);}
  .cmp-row{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;}
  .cmp-row:last-of-type{border-bottom:none;}
  .cmp-val{font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;}
  .cmp-trend{font-family:'Heebo',sans-serif;font-size:9px;color:var(--text-dim);text-align:center;margin-top:3px;line-height:1.3;}
  .cmp-open-full{display:block;font-family:'Heebo',sans-serif;font-size:9.5px;font-weight:400;color:var(--teal);cursor:pointer;margin-top:2px;}
  .cmp-open-full:hover{text-decoration:underline;}
  .cmp-label{font-size:10.5px;color:var(--text-dim);text-align:center;line-height:1.3;}
  .close-compare-btn{display:block;width:100%;text-align:center;padding:10px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--text-dim);cursor:pointer;font-size:12.5px;margin-top:12px;font-family:'Heebo',sans-serif;}
  .close-compare-btn:hover{color:var(--text);border-color:var(--text-dim);}
</style>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
(function(){
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js';
  s.onerror = function(){
    console.warn('[chart.js] cdnjs failed to load, trying jsdelivr fallback');
    var s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js';
    s2.onerror = function(){ console.error('[chart.js] both CDN sources failed — fundamentals charts will not render'); };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
})();
</script>
</head>
<body>

<header>
  <div class="logo">
    <div class="mark"></div>
    <div>
      <h1>Swing Desk</h1>
      <div class="sub" id="header-sub">דשבורד מסחר בזמן אמת</div>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="search-input" class="search-input mono" placeholder="חפש טיקר... (למשל AAPL)" />
    <button class="search-btn" onclick="handleSearch()" id="search-btn-label">חפש</button>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <button id="lang-toggle" onclick="toggleLang()" style="background:var(--panel);border:1px solid var(--line);color:var(--text-dim);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s;" onmouseover="this.style.borderColor='var(--amber)'" onmouseout="this.style.borderColor='var(--line)'">EN</button>
    <div class="clock mono" id="clock"></div>
  </div>
</header>

<!-- Mobile Search Bar (visible only on small screens) -->
<div class="mobile-search">
  <input type="text" id="search-input-mobile" class="search-input mono" placeholder="חפש טיקר... (למשל AAPL)" />
  <button class="search-btn" id="search-btn-mobile" onclick="handleSearchMobile()">חפש</button>
</div>

<!-- Breaking News Bar -->
<div class="breaking-bar">
  <div class="breaking-bar-title"><span class="pulse"></span> חדשות שוברות — קריטי</div>
  <div class="breaking-items" id="breaking-news"></div>
</div>

<!-- Market Index Charts -->
<div class="market-charts">
  <div class="market-charts-row">
    <div class="chart-col">
      <div class="market-charts-title">גרפי מדדים</div>
      <div class="chart-tabs">
        <button class="chart-tab active" onclick="switchChart('SPY')">SPY</button>
        <button class="chart-tab" onclick="switchChart('QQQ')">QQQ</button>
        <button class="chart-tab" onclick="switchChart('GLD')">GLD (זהב)</button>
        <button class="chart-tab" onclick="switchChart('IWM')">IWM (ראסל)</button>
        <button class="chart-tab" onclick="switchChart('BTCUSD')">Bitcoin</button>
      </div>
      <div id="market-tv-chart"></div>
    </div>
    <div class="movers-col">
      <div class="movers-title" id="movers-title">הכי זזות היום בשוק</div>
      <div class="movers-list" id="movers-list"></div>
    </div>
  </div>
</div>

<!-- Main Board -->
<div class="board">
  <div class="col right">
    <div class="col-title"><span class="dot"></span> סורק סווינג — משימות פתוחות</div>
    <div id="stocks"></div>
  </div>
  <div class="divider"></div>
  <div class="col left">
    <div class="col-title"><span class="dot"></span> מוקד מאקרו וחדשות עולם</div>
    <div class="sector-filter" id="sector-filter"></div>
    <div id="macro"></div>
  </div>
</div>

<div class="disclaimer-strip">
  התוכן להמחשה בלבד ואינו מהווה ייעוץ השקעות או המלצה לביצוע עסקה.
</div>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<script>
// ---- Demo data (shown when API is offline) ----
const stocks = [
  {ticker:"IGV", trend:"up", score:82, trigger:"פריצת שיאים יורדים בווליום חזק", trigger_en:"Descending trendline breakout on strong volume", entry:71.4, support:66.2, resistance:[74.9,78.6], summary:"זוהתה פריצה טכנית: נפח גבוה מהממוצע.", summary_en:"Technical breakout detected: volume significantly above 20d average.", changePct:3.8},
  {ticker:"CRWD", trend:"up", score:76, trigger:"פריצת דגל שורי על נפח גבוה", trigger_en:"Bull flag breakout on high volume", entry:298.1, support:281.0, resistance:[312.0,329.5], summary:"זוהתה פריצה טכנית: נפח גבוה מהממוצע.", summary_en:"Technical breakout detected: volume above average with positive trend.", changePct:5.2},

// Formats a raw number into a compact, human-readable form for chart axes
// and tooltips — e.g. 186000000000 -> "$186.00B" instead of the full digit
// string, which is unreadable on a hover tooltip or a cramped y-axis.
function fmtCompactMoney(v){
  if(v==null || isNaN(v)) return '—';
  const sign = v<0 ? '-' : '';
  const abs = Math.abs(v);
  if(abs>=1e9) return sign+'$'+(abs/1e9).toFixed(2)+'B';
  if(abs>=1e6) return sign+'$'+(abs/1e6).toFixed(2)+'M';
  if(abs>=1e3) return sign+'$'+(abs/1e3).toFixed(1)+'K';
  return sign+'$'+abs.toFixed(2);
}
// Same idea but without the $ sign and fewer decimals — used in the tight
// compare-table "trend" line where space is at a premium.
function fmtCompactShort(v){
  if(v==null) return '';
  const sign = v<0 ? '-' : '';
  const abs = Math.abs(v);
  if(abs>=1e9) return sign+(abs/1e9).toFixed(1)+'B';
  if(abs>=1e6) return sign+(abs/1e6).toFixed(1)+'M';
  if(abs>=1e3) return sign+(abs/1e3).toFixed(0)+'K';
  return sign+abs.toFixed(1);
}

function fundBarOptions(valueFormatter){
  return {
    responsive:false, maintainAspectRatio:false,
    plugins:{
      legend:{ display:false }, // replaced by a fixed HTML legend — see fundLegendHtml()
      tooltip: valueFormatter ? { callbacks:{ label:(ctx)=>`${ctx.dataset.label}: ${valueFormatter(ctx.parsed.y)}` } } : {},
    },
    scales:{
      x:{ grid:{display:false}, ticks:{font:{size:9}, maxRotation:0, autoSkip:true, maxTicksLimit:12} },
      y:{ grid:{color:'rgba(255,255,255,0.06)'}, ticks:{font:{size:9}, callback: valueFormatter ? (v)=>valueFormatter(v) : undefined} },
    }
  };
}
function fundLineOptions(valueFormatter){
  return {
    responsive:false, maintainAspectRatio:false,
    plugins:{
      legend:{ display:false },
      tooltip: valueFormatter ? { callbacks:{ label:(ctx)=>`${ctx.dataset.label}: ${valueFormatter(ctx.parsed.y)}` } } : {},
    },
    scales:{
      x:{ grid:{display:false}, ticks:{font:{size:8}, maxRotation:0, autoSkip:true, maxTicksLimit:8} },
      y:{ grid:{color:'rgba(255,255,255,0.06)'}, ticks:{font:{size:9}, callback: valueFormatter ? (v)=>valueFormatter(v) : undefined} },
    }

}

// A fixed HTML legend that sits above the scrollable chart, instead of
// Chart.js's built-in legend — which renders relative to the chart's OWN
// (very wide) canvas coordinate space, so in a horizontally-scrolling +
// RTL layout it ends up positioned off-screen until scrolled to just the
// right spot. This is always visible regardless of scroll position.
function fundLegendHtml(items){
  return `<div class="fund-legend">${items.map(it=>
    `<span class="fund-legend-item"><span class="fund-legend-dot" style="background:${it.color}"></span>${it.label}</span>`
  ).join('')}</div>`;
}

    en: 'P/E = share price divided by earnings per share. "Trailing" uses the last 12 months of actual earnings, "Forward" uses analyst estimates for the coming year. A higher multiple means the market is pricing in more growth (or the stock is expensive relative to its earnings). Most useful compared against the stock\'s own historical average or similar companies in its sector — not as a standalone number.'
  },
  eps_est: {

function fundInfoIcon(key){
  const tip = FUND_TIPS[key];
  if(!tip) return '';
  const text = (lang==='en') ? tip.en : tip.he;
  return `<span class="fund-info" onclick="toggleFundTip(event,this)">i<span class="fund-tip">${text}</span></span>`;
}

function toggleFundTip(ev, iconEl){
  ev.stopPropagation();
  const tip = iconEl.querySelector('.fund-tip');
  const wasOpen = tip.classList.contains('show');
  document.querySelectorAll('.fund-tip.show').forEach(t=>t.classList.remove('show'));
  document.querySelectorAll('.fund-info.open').forEach(i=>i.classList.remove('open'));
  if(!wasOpen){ tip.classList.add('show'); iconEl.classList.add('open'); }
}
document.addEventListener('click', ()=>{
  document.querySelectorAll('.fund-tip.show').forEach(t=>t.classList.remove('show'));
  document.querySelectorAll('.fund-info.open').forEach(i=>i.classList.remove('open'));
});

async function loadFundamentals(ticker){
  const el = document.getElementById("fundamentals-section");
  if(!el) return;
  const t = lang==='en';
  el.innerHTML = `<div class="fund-section-title">${t?'Fundamentals':'נתונים פונדמנטליים'}</div><div class="fund-empty">${t?'Loading fundamentals...':'טוען נתונים פונדמנטליים...'}</div>`;
  let data;
  try {
    const res = await fetch(`${API_BASE}/api/fundamentals/${ticker}`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch(e) {
    console.error('[fundamentals] fetch/parse failed for', ticker, e);
    el.innerHTML = `<div class="fund-section-title">${t?'Fundamentals':'נתונים פונדמנטליים'}</div><div class="fund-empty">${t?'Could not load fundamentals right now.':'לא ניתן לטעון נתונים פונדמנטליים כרגע.'}</div>`;
    return;
  }
  try {
    renderFundamentals(data);
  } catch(e) {
    console.error('[fundamentals] render failed for', ticker, e);
    el.innerHTML = `<div class="fund-section-title">${t?'Fundamentals':'נתונים פונדמנטליים'}</div><div class="fund-empty">${t?'Data loaded but failed to render — check console.':'הנתונים נטענו אך הצגתם נכשלה — בדוק את הקונסול.'}</div>`;
  }
}

function renderFundamentals(data){

  const epsActualOnlyCtx = document.getElementById('chart-eps-actual-only');
  if(epsActualOnlyCtx && data.diluted_eps_labels && data.diluted_eps_labels.length){
    epsActualOnlyCtx.width = Math.max(data.diluted_eps_labels.length * 46, 280); epsActualOnlyCtx.height = 150;
    safeChart(epsActualOnlyCtx, {

  const peCtx = document.getElementById('chart-pe');

// ---- Compare two stocks side by side ----
function lastVal(arr){
  if(!Array.isArray(arr)) return null;
  for(let i=arr.length-1;i>=0;i--){ if(arr[i]!=null) return arr[i]; }
  return null;
}
// Last up to `n` non-null values, oldest→newest — used to show a short
// trend (not just the single latest quarter) under each compare value.
function lastN(arr, n){
  if(!Array.isArray(arr)) return [];
  return arr.filter(v=>v!=null).slice(-n);
}
function trendStr(arr, formatter){
  const vals = lastN(arr, 4);
  if(vals.length<2) return '';
  return vals.map(formatter).join(' → ');
}
function cmpRow(label, a, b, fmt, betterHigher=null, trendA='', trendB=''){
  let ca='color:var(--text)', cb='color:var(--text)';
  if(betterHigher!==null && a!=null && b!=null && a!==b){
    const aBetter = betterHigher ? a>b : a<b;
    ca = 'color:'+(aBetter?'var(--green)':'var(--text-dim)');
    cb = 'color:'+(aBetter?'var(--text-dim)':'var(--green)');
  }
  return `<div class="cmp-row">
    <div class="cmp-val" style="${cb}">${b!=null?fmt(b):'—'}${trendB?`<div class="cmp-trend">${trendB}</div>`:''}</div>
    <div class="cmp-label">${label}</div>
    <div class="cmp-val" style="${ca}">${a!=null?fmt(a):'—'}${trendA?`<div class="cmp-trend">${trendA}</div>`:''}</div>
  </div>`;
}

async function openCompare(baseTicker){
  const t = lang==='en';
  const raw = prompt(t?'Compare with which ticker?':'להשוות מול איזה טיקר?');
  if(!raw) return;
  const ticker2 = raw.trim().toUpperCase();
  if(!ticker2 || ticker2===baseTicker.toUpperCase()) return;

  const compareEl = document.getElementById('compare-section');
  if(!compareEl) return;
  compareEl.innerHTML = `<div class="fund-section-title">${t?'Comparison':'השוואת מניות'}</div><div class="fund-empty">${t?'Loading comparison...':'טוען השוואה...'}</div>`;

  const safeFetch = async (url) => {
    try { const r = await fetch(url); return r.ok ? await r.json() : null; }
    catch { return null; }
  };

  try {
    const [lookA, lookB, fundA, fundB] = await Promise.all([
      safeFetch(`${API_BASE}/api/lookup/${baseTicker}`),
      safeFetch(`${API_BASE}/api/lookup/${ticker2}`),
      safeFetch(`${API_BASE}/api/fundamentals/${baseTicker}`),
      safeFetch(`${API_BASE}/api/fundamentals/${ticker2}`),
    ]);
    renderCompare(compareEl, baseTicker.toUpperCase(), ticker2, lookA, lookB, fundA, fundB);
    track('compare_stock', `${baseTicker}_vs_${ticker2}`);
  } catch(e) {
    console.error('[compare] failed', e);
    compareEl.innerHTML = `<div class="fund-section-title">${t?'Comparison':'השוואת מניות'}</div><div class="fund-empty">${t?'Could not load comparison right now.':'לא ניתן לטעון השוואה כרגע.'}</div>`;
  }
}

function renderCompare(el, tA, tB, lookA, lookB, fundA, fundB){
  const t = lang==='en';
  const gmA = fundA && Array.isArray(fundA.gross_margin_pct) ? lastVal(fundA.gross_margin_pct) : null;
  const gmB = fundB && Array.isArray(fundB.gross_margin_pct) ? lastVal(fundB.gross_margin_pct) : null;
  const trendLabel = t?'(last 4 quarters)':'(4 רבעונים אחרונים)';

  const rows = [
    cmpRow(t?'Price':'מחיר', lookA?.price, lookB?.price, v=>'$'+v),
    cmpRow(t?'Daily Change %':'שינוי יומי %', lookA?.change_pct, lookB?.change_pct, v=>v.toFixed(2)+'%', true),
    cmpRow(t?'Market Cap':'שווי שוק', lookA?.market_cap, lookB?.market_cap, v=>fmtCompactMoney(v), true),
    cmpRow(t?'Trailing P/E':'מכפיל P/E נוכחי', fundA?.trailing_pe, fundB?.trailing_pe, v=>v.toFixed(1)),
    cmpRow(`${t?'Revenue':'הכנסות'} ${trendLabel}`, lastVal(fundA?.revenue), lastVal(fundB?.revenue), v=>fmtCompactMoney(v), true,
      trendStr(fundA?.revenue, fmtCompactShort), trendStr(fundB?.revenue, fmtCompactShort)),
    cmpRow(`${t?'Net Income':'רווח נקי'} ${trendLabel}`, lastVal(fundA?.net_income), lastVal(fundB?.net_income), v=>fmtCompactMoney(v), true,
      trendStr(fundA?.net_income, fmtCompactShort), trendStr(fundB?.net_income, fmtCompactShort)),
    cmpRow(`FCF ${trendLabel}`, lastVal(fundA?.fcf), lastVal(fundB?.fcf), v=>fmtCompactMoney(v), true,
      trendStr(fundA?.fcf, fmtCompactShort), trendStr(fundB?.fcf, fmtCompactShort)),
    cmpRow(`${t?'Gross Margin %':'שולי רווח גולמי %'} ${trendLabel}`, gmA, gmB, v=>v.toFixed(1)+'%', true,
      trendStr(fundA?.gross_margin_pct, v=>v.toFixed(0)+'%'), trendStr(fundB?.gross_margin_pct, v=>v.toFixed(0)+'%')),
    cmpRow(`${t?'Net Debt':'חוב נטו'} ${trendLabel}`, lastVal(fundA?.net_debt), lastVal(fundB?.net_debt), v=>fmtCompactMoney(v), false,
      trendStr(fundA?.net_debt, fmtCompactShort), trendStr(fundB?.net_debt, fmtCompactShort)),
    cmpRow(`${t?'Diluted EPS':'EPS מדולל'} ${trendLabel}`, lastVal(fundA?.diluted_eps), lastVal(fundB?.diluted_eps), v=>v.toFixed(2), true,
      trendStr(fundA?.diluted_eps, v=>v.toFixed(2)), trendStr(fundB?.diluted_eps, v=>v.toFixed(2))),
  ];

  const noteA = (!lookA && !fundA?.has_fundamentals) ? `<div class="fund-empty">${t?`Couldn't load data for ${tA}.`:`לא ניתן היה לטעון נתונים עבור ${tA}.`}</div>` : '';
  const noteB = (!lookB && !fundB?.has_fundamentals) ? `<div class="fund-empty">${t?`Couldn't load data for ${tB}.`:`לא ניתן היה לטעון נתונים עבור ${tB}.`}</div>` : '';

  el.innerHTML = `
    <div class="fund-section-title">${t?'Comparison':'השוואת מניות'}</div>
    <div class="cmp-head">
      <div class="cmp-ticker">${tB}<span class="cmp-open-full" onclick="showTickerDrawer('${tB}')">${t?'open full ↗':'פתח מלא ↗'}</span></div>
      <div></div>
      <div class="cmp-ticker">${tA}<span class="cmp-open-full" onclick="showTickerDrawer('${tA}')">${t?'open full ↗':'פתח מלא ↗'}</span></div>
    </div>
    ${rows.join('')}
    ${noteA}${noteB}
    <button class="close-compare-btn" onclick="document.getElementById('compare-section').innerHTML=''">${t?'Close comparison':'סגור השוואה'}</button>
  `;
}

// ---- API ----
const API_BASE = "https://swing-dashboard-production-438f.up.railway.app";

function getSessionId(){
  let sid = localStorage.getItem('swing_sid');
  if(!sid){ sid=crypto.randomUUID(); localStorage.setItem('swing_sid',sid); }
  return sid;
}
function track(eventType, entityId){
  fetch(`${API_BASE}/api/track`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({event_type:eventType,entity_id:entityId,session_id:getSessionId()})
  }).catch(()=>{});
}
track('page_view',null);

const statusEl = document.createElement("div");
statusEl.style.cssText="position:fixed;bottom:12px;left:16px;font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 9px;border-radius:6px;z-index:60;";
document.body.appendChild(statusEl);

function setStatus(connected){
  statusEl.textContent = connected?"● מחובר ל-API":"● נתוני דמו (ה-API לא זמין)";
  statusEl.style.background = connected?"rgba(62,207,126,.15)":"rgba(232,163,61,.15)";
  statusEl.style.color = connected?"var(--green)":"var(--amber)";
}

function mapDbRowToStock(r){
  return {
    ticker:r.ticker, trend:(r.swing_score>=50)?"up":"down", score:r.swing_score,
    trigger: lang==='en' ? (r.trigger_text_en||r.trigger_text_he) : (r.trigger_text_he||r.trigger_text_en),
    entry:r.entry_price, support:r.support_level,
    resistance:r.resistance_targets, socialSpike:r.social_volume_spike_pct,
    summary: lang==='en' ? (r.ai_summary_en||r.ai_summary_he) : (r.ai_summary_he||r.ai_summary_en),
    summary_he: r.ai_summary_he,
    summary_en: r.ai_summary_en,
    trigger_he: r.trigger_text_he,
    trigger_en: r.trigger_text_en,
    timestamp: r.timestamp,
    changePct: (r.change_pct===null||r.change_pct===undefined) ? null : Number(r.change_pct),
  };
}

// Given the deduped/ordered stocks array (newest first), mark each row
// isRecent=true if it belongs to the same calendar day as the most recent
// scan, otherwise false (an earlier day's match, kept for context).
function markRecencyGroups(list){
  if(!list.length) return list;
  const latestDay = list[0].timestamp ? new Date(list[0].timestamp).toDateString() : null;
  for(const s of list){
    s.isRecent = latestDay ? (new Date(s.timestamp).toDateString() === latestDay) : true;
  }
  return list;
}

// Keep only the latest row per ticker (rows are already ordered newest-first
// by the API), so a stock flagged both at market open and close only shows once.
function dedupeByTicker(list){
  const seen = new Set();
  const out = [];
  for(const s of list){
    if(seen.has(s.ticker)) continue;
    seen.add(s.ticker);
    out.push(s);
  }
  return out;
}

async function loadFromApi(){
  try {
    const [stocksRes, macroRes] = await Promise.all([
      fetch(`${API_BASE}/api/stocks?limit=60`),
      fetch(`${API_BASE}/api/macro-news`),
    ]);
    if(!stocksRes.ok||!macroRes.ok) throw new Error("API error");
    const dbStocks = await stocksRes.json();
    const dbMacro = await macroRes.json();
    if(dbStocks.length>0){ rawStocks = dbStocks; }
    if(dbMacro.length>0){ rawMacro = dbMacro; }
    setStatus(true);
  } catch(e){
    console.warn("API offline, showing demo data:", e);
    setStatus(false);
  }
  applyLang(); // rebuild everything in the active language
}

function applyLang(){
  const t = UI[lang];
  document.documentElement.setAttribute('dir', t.dir);
  document.documentElement.setAttribute('lang', lang === 'he' ? 'he' : 'en');
  document.getElementById('header-sub').textContent = t.sub;
  document.getElementById('search-input').placeholder = t.search_placeholder;
  document.getElementById('search-input-mobile').placeholder = t.search_placeholder;
  document.getElementById('search-btn-label').textContent = t.search_btn;
  document.getElementById('search-btn-mobile').textContent = t.search_btn;
  document.getElementById('lang-toggle').textContent = t.lang_btn;
  document.querySelector('.breaking-bar-title').innerHTML = `<span class="pulse"></span> ${t.breaking_title}`;
  document.querySelector('.right .col-title').innerHTML = `<span class="dot"></span> ${t.scanner_title}`;
  document.querySelector('.left .col-title').innerHTML = `<span class="dot"></span> ${t.macro_title}`;
  document.querySelector('.market-charts-title').textContent = t.charts_title;
  document.getElementById('movers-title').textContent = t.movers_title;

  // Rebuild stocks and macro arrays from raw API data in the active language
  if(rawStocks.length > 0){
    stocks.length = 0;
    const mapped = dedupeByTicker(rawStocks.map(mapDbRowToStock));
    markRecencyGroups(mapped);
    for(const s of mapped) stocks.push(s);
  }
  if(rawMacro.length > 0){
    macro.length = 0;
    for(const r of rawMacro){
      macro.push({
        tag: r.category_tag,
        impact: r.impact_level,
        text: lang==='en' ? (r.summary_en||r.summary_he) : (r.summary_he||r.summary_en),
        summary_he: r.summary_he,
        summary_en: r.summary_en,
        hook_he: r.hook_he || '',
        time: new Date(r.timestamp).toLocaleString(lang==='he'?'he-IL':'en-US'),
        source: r.source_url ? new URL(r.source_url).hostname.replace('www.','') : '',
        link: r.source_url||'#',
        sectors: r.category_tag || '',  // use tag as sector fallback until API sends sector data
      });
    }
  }

  renderStocks();
  renderMovers();
  renderMacro();
  renderBreakingNews();
  renderSectorFilter();
}

function toggleLang(){
  lang = lang === 'he' ? 'en' : 'he';
  localStorage.setItem('swing_lang', lang);
  applyLang();
}

function getNewsText(item){

  return item.summary_he || item.text || '';
}
